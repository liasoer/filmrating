<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filmrating">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Filmrating</title>
<style>
:root{
  --bg:#000;--bg2:#0d0d10;--grp:#1c1c1e;--grp2:#2c2c2e;--sep:rgba(84,84,88,.45);
  --t1:#fff;--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.32);
  --tint:#0a84ff;--tint2:#5e5ce6;
  --ok:#30d158;--mid:#ffd60a;--low:#ff9f0a;--bad:#ff453a;
  --glass:rgba(40,40,46,.62);--glass-b:rgba(255,255,255,.14);
  --sa-t:env(safe-area-inset-top);--sa-b:env(safe-area-inset-bottom);
  --r-xl:34px;--r-l:26px;--r-m:18px;--r-s:12px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{min-height:100%;min-height:100lvh;background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--t1);font:17px/1.35 var(--f);letter-spacing:-.2px;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;font-size:17px;color:var(--t1)}
svg{display:block}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 0 0 .5px var(--glass-b),0 10px 30px rgba(0,0,0,.35)}
.glass-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.glass-btn:active{transform:scale(.88)}

/* ---------- Hintergrund-Glow ---------- */
.glow{position:fixed;inset:-20% -20% auto;height:60vh;pointer-events:none;z-index:0;
  background:radial-gradient(50% 50% at 25% 30%,rgba(10,132,255,.22),transparent 70%),radial-gradient(45% 45% at 80% 20%,rgba(94,92,230,.18),transparent 70%);filter:blur(10px)}

/* ---------- Layout ---------- */
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:calc(var(--sa-t) + 26px) 16px calc(var(--sa-b) + 96px)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}
.hdr .large{margin:0}
.hdr .avatar{width:40px;height:40px;flex:none}
.navbar{display:flex;justify-content:flex-end;align-items:center;height:48px;gap:10px}
.avatar{font-weight:700;font-size:17px;color:#4da3ff}
.large{font:800 34px/1.1 var(--f);letter-spacing:-.8px;margin:2px 4px 14px}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;padding:0 14px;background:rgba(118,118,128,.24)}
.search input{flex:1;background:none;border:0;outline:none;min-width:0;height:100%}
.search input::placeholder{color:var(--t2)}
.chips{display:flex;gap:8px;margin:12px -16px 4px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:17px;font-size:15px;font-weight:600;color:var(--t2);background:rgba(118,118,128,.18);transition:all .2s}
.chip.on{color:#000;background:var(--t1)}

/* ---------- Liste ---------- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 12px 10px 10px;border-radius:var(--r-l);
  background:rgba(38,38,44,.55);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.10),0 8px 24px rgba(0,0,0,.35);transition:transform .2s cubic-bezier(.3,1.3,.5,1)}
.card-bg{position:absolute;inset:-30px;z-index:-1;background:center/cover;filter:blur(28px) saturate(170%) brightness(.55);opacity:.85;transform:scale(1.1)}
.card-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(20,20,24,.15) 0%,rgba(20,20,24,.55) 55%,rgba(20,20,24,.8) 100%)}
.card .ring span{background:rgba(18,18,22,.72)}
.card .pill{background:rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
.card .meta{color:rgba(255,255,255,.7)}
.card:active{transform:scale(.975)}
.poster{flex:none;width:64px;height:96px;border-radius:14px;background:#26262b center/cover;display:grid;place-items:center;color:var(--t3);overflow:hidden;box-shadow:0 0 0 .5px rgba(255,255,255,.08)}
.info{flex:1;min-width:0}
.title{font-weight:650;font-size:17px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--t2);font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ext{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;color:var(--t2);background:rgba(118,118,128,.2);white-space:nowrap}
.pill b{color:var(--t1);font-weight:700}
.rank{flex:none;width:22px;text-align:center;font-weight:800;color:var(--t3);font-size:15px}

/* Score-Ring */
.ring{--v:0;--c:var(--ok);flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(255,255,255,.1) 0)}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--grp);display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:-.3px}
.ring.xl{width:84px;height:84px}
.ring.xl span{width:70px;height:70px;font-size:26px;background:#121214}
.ring.sm{width:40px;height:40px}
.ring.sm span{width:32px;height:32px;font-size:13px;background:#2a2a2e}

.empty{text-align:center;color:var(--t2);padding:70px 24px;font-size:16px}
.empty svg{margin:0 auto 14px;opacity:.5}

/* ---------- Schwebende Tab-Leiste ---------- */
.dock{position:fixed;left:0;right:0;bottom:max(12px, calc(var(--sa-b) - 14px));z-index:10;display:flex;justify-content:center;align-items:center;gap:12px;padding:0 16px;pointer-events:none}
.tabbar{pointer-events:auto;display:flex;height:62px;border-radius:31px;padding:4px;flex:1;max-width:370px}
.tab{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--t1);opacity:.75;transition:all .25s}
.tab.on{opacity:1;color:#4da3ff;background:rgba(255,255,255,.1)}
.addbtn{pointer-events:auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--tint)}
.addbtn:active,.tab:active{transform:scale(.92)}

/* ---------- Sheets ---------- */
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;top:calc(var(--sa-t) + 12px);bottom:0;z-index:31;max-width:680px;margin:0 auto;background:#111113;border-radius:var(--r-xl) var(--r-xl) 0 0;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -0.5px 0 rgba(255,255,255,.15)}
.sheet.open{transform:none}
.sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:200px;background:#111113}
.sh-bar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.sh-bar h3{font-size:17px;font-weight:650}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:68px 16px calc(var(--sa-b) + 30px)}
.grab{position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:rgba(255,255,255,.28);z-index:4}
.done{height:44px;padding:0 18px;border-radius:22px;font-weight:650;color:#fff;background:var(--tint)}
.done:active{transform:scale(.94)}

/* Detail-Hero */
.hero{position:relative;margin:-68px -16px 0;padding:74px 20px 22px;overflow:hidden}
.hero-bg{position:absolute;inset:-40px;background:center/cover;filter:blur(40px) saturate(160%) brightness(.55);transform:scale(1.2)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,#111113 92%)}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero .poster{width:150px;height:225px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12)}
.hero h2{font:800 26px/1.15 var(--f);letter-spacing:-.5px;margin-top:18px}
.hero .meta{white-space:normal;margin-top:6px}
.hero .ext{justify-content:center}
.scorerow{display:flex;align-items:center;gap:14px;margin-top:18px}
.scorerow .lbl{text-align:left;color:var(--t2);font-size:14px}
.scorerow .lbl b{display:block;color:var(--t1);font-size:17px}

/* Gruppierte Listen */
.sec{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.3px;margin:24px 16px 8px}
.grp{background:rgba(44,44,50,.55);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-radius:var(--r-l);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 .5px rgba(255,255,255,.08)}
.grp+.grp{margin-top:12px}
.cell{padding:14px 16px;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cell-h b{font-weight:650}
.note{color:var(--t2);font-size:15px;margin-top:8px;white-space:pre-wrap}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14px;color:var(--t2);margin-top:10px}
.bars b{color:var(--t1);font-weight:700;min-width:30px;text-align:right}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--tint)}
.btn{display:block;width:100%;height:52px;border-radius:26px;font-weight:650;font-size:17px;margin-top:14px}
.btn.pri{color:#fff;background:var(--tint)}
.btn.sec2{background:var(--grp);color:var(--tint)}
.btn.red{background:var(--grp);color:var(--bad)}
.btn:active{transform:scale(.97);opacity:.85}

/* Formular */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 16px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.field label{color:var(--t1)}
.field input{background:none;border:0;outline:none;text-align:right;color:var(--t2);min-width:0;flex:1}
.field input[type=date]{-webkit-appearance:none;appearance:none;flex:none;background:rgba(118,118,128,.24);border-radius:8px;padding:6px 10px;color:var(--t1);text-align:center}
.crit{padding:14px 16px 10px;position:relative}
.crit+.crit::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.crit .h{display:flex;justify-content:space-between;align-items:baseline}
.crit .v{font-weight:800;font-size:22px;color:var(--tint);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:2px 0 0;touch-action:pan-y}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--tint) var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.1)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--tint)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);padding:0 6px}
textarea.ta{width:100%;min-height:96px;background:none;border:0;outline:none;resize:none;padding:14px 16px;color:var(--t1)}
textarea.ta::placeholder,.field input::placeholder{color:var(--t3)}
.total{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.total b{font-size:17px}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;position:relative}
.res+.res::before{content:"";position:absolute;top:0;left:70px;right:0;height:.5px;background:var(--sep)}
.res:active{background:var(--grp2)}
.res .poster{width:42px;height:63px;border-radius:9px}
.picked{display:flex;align-items:center;gap:14px;padding:12px}
.picked .poster{width:64px;height:96px}
.link{color:var(--tint);font-weight:600}
.hint{color:var(--t2);font-size:13px;margin:8px 16px 0}


/* Neu: Netflix-Startseite */
.hero-rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hero-rail::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.hcard{flex:none;position:relative;width:232px;aspect-ratio:2/3;border-radius:22px;overflow:hidden;scroll-snap-align:start;background:#1c1c1e center/cover;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.1);transition:transform .25s}
.hcard:active{transform:scale(.97)}
.hcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 22%,transparent 45%,rgba(0,0,0,.92) 100%)}
.hc-in{position:absolute;left:0;right:0;bottom:0;padding:14px;z-index:1}
.hc-in .ext{gap:4px}
.hc-t{font:800 21px/1.12 var(--f);letter-spacing:-.4px}
.hc-m{font-size:14px;color:rgba(255,255,255,.75);margin-top:6px}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:1}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:800;letter-spacing:.3px;color:#fff;background:rgba(20,20,24,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.badge.new{color:#fff;background:var(--tint)}
.rowh{font:700 21px/1.2 var(--f);letter-spacing:-.4px;margin:28px 2px 10px}
.rail{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pcard{flex:none;width:116px;text-align:left;scroll-snap-align:start}
.pcard .poster{width:116px;height:174px;border-radius:14px;position:relative}
.pcard .badge{position:absolute;top:6px;left:6px;height:18px;padding:0 6px;font-size:9.5px}
.pcard:active .poster{transform:scale(.96)}
.pt{font-size:13px;font-weight:600;line-height:1.25;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm{font-size:12px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pring{position:absolute;right:5px;bottom:5px}
.pring .ring.sm{width:36px;height:36px}.pring .ring.sm span{width:29px;height:29px;font-size:12px;background:#1c1c1e}
.pill.fmt{color:#64b5ff;background:rgba(10,132,255,.18)}

/* Bewertungs-Assistent */
.sh-foot{position:relative;z-index:2;padding:12px 16px calc(var(--sa-b) + 14px);background:#111113;box-shadow:0 -0.5px 0 rgba(255,255,255,.08)}
.prog{display:flex;gap:5px;justify-content:center}
.prog i{width:18px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);transition:all .3s}
.prog i.d{background:rgba(10,132,255,.55)}
.prog i.on{width:30px;background:var(--tint)}
.wz.in-r{animation:inr .32s cubic-bezier(.2,.9,.3,1)}
.wz.in-l{animation:inl .32s cubic-bezier(.2,.9,.3,1)}
@keyframes inr{from{opacity:0;transform:translateX(28px)}}
@keyframes inl{from{opacity:0;transform:translateX(-28px)}}
.wz-h{font:800 28px/1.15 var(--f);letter-spacing:-.6px;text-align:center;margin-top:8px}
.wz-film{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-l);background:var(--grp)}
.wz-film .poster{width:48px;height:72px;border-radius:10px}
.wz-film .info{flex:1;min-width:0}
.wz-film .ext{margin-top:5px}
.wz-crit{display:flex;flex-direction:column;align-items:center;padding-top:3.5vh}
.wz-bg{position:absolute;inset:-80px;z-index:0;background:center/cover;filter:blur(60px) saturate(170%) brightness(.38);transform:scale(1.15);pointer-events:none;transition:background-image .4s}
.wz-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(17,17,19,.2),rgba(17,17,19,.75) 70%)}
.sheet.wiz .sh-body,.sheet.wiz .sh-bar{position:relative;z-index:1}
.sheet.wiz .sh-bar{position:absolute;z-index:5}
.sheet.wiz .grab{z-index:6}
.sheet.wiz .sh-foot{background:linear-gradient(rgba(17,17,19,0),rgba(17,17,19,.85) 45%);box-shadow:none}
.sheet.wiz .grp,.sheet.wiz .wz-film{background:rgba(44,44,50,.55);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.sheet.wiz .search{background:rgba(118,118,128,.3)}
.meter{--v:70;--c:var(--ok);width:min(58vw,230px);aspect-ratio:1;border-radius:50%;margin:3.5vh 0 3vh;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(255,255,255,.1) 0);transition:--v .2s;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px));mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px));filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 45%,transparent))}
.meter-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.meter{-webkit-mask:none;mask:none;background:none}
.meter::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(255,255,255,.1) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px));mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px))}
.meter.sm{width:150px}
.meter.sm .wz-val{font-size:46px}
.wz-word{font-size:15px;font-weight:700;margin-top:4px;letter-spacing:.2px}
.wz-step{font-size:13px;font-weight:700;color:var(--tint);text-transform:uppercase;letter-spacing:.6px}
.wz-val{font:800 72px/1 var(--f);letter-spacing:-2.5px;font-variant-numeric:tabular-nums}
.wz-ctl{display:flex;align-items:center;gap:14px;width:100%}
.wz-ctl input{flex:1}
.wz-ctl .glass-btn{flex:none;width:48px;height:48px;color:var(--t1)}

/* Login */
.auth{min-height:calc(100dvh - var(--sa-t) - var(--sa-b) - 40px);display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.logo{width:96px;height:96px;margin:0 auto 22px;border-radius:24px;background:url(icon.png) center/cover;box-shadow:0 18px 50px rgba(10,132,255,.35),0 0 0 .5px rgba(255,255,255,.15)}
.auth h1{font:800 34px/1.1 var(--f);text-align:center;letter-spacing:-.8px}
.auth p{text-align:center;color:var(--t2);margin:10px 20px 30px}

function extPills(e, fm=[]){
  const p=fm.map(f=>`<span class="pill fmt">${esc(f)}</span>`);
  if(!e) return p.length?`<div class="ext">${p.join('')}</div>`:'';
  if(e.imdb) p.push(`<span class="pill">IMDb <b>${esc(e.imdb)}</b></span>`);
  if(e.rt)   p.push(`<span class="pill">🍅 <b>${esc(e.rt)}</b></span>`);
  if(e.mc)   p.push(`<span class="pill">MC <b>${esc(e.mc)}</b></span>`);
  return p.length ? `<div class="ext">${p.join('')}</div>` : '';
}

/* ================= Filmsuche: Wikidata (Teilwörter, deutsche Titel) + OMDb ================= */
const Finder = {
  cache:{},
  norm: s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(),
  async wikidata(q){
    const W='https://www.wikidata.org/w/api.php?format=json&origin=*';
    const words = Finder.norm(q).split(' ').filter(Boolean);
    const tw = words.filter(w=>!/^\d{1,2}$/.test(w));
    if(!tw.length) return [];
    const sr = tw.map(w=>w+'*').join(' ')+' haswbstatement:P345';
    const lbl = {};
    const [s, sde, sen] = await Promise.all([
      fetch(`${W}&action=query&list=search&srlimit=40&srsearch=${encodeURIComponent(sr+' haswbstatement:P31=Q11424')}`).then(r=>r.json()),
      fetch(`${W}&action=wbsearchentities&type=item&limit=50&language=de&uselang=de&search=${encodeURIComponent(q)}`).then(r=>r.json()),
      fetch(`${W}&action=wbsearchentities&type=item&limit=50&language=en&uselang=en&search=${encodeURIComponent(q)}`).then(r=>r.json())
    ]);
    [...(sde.search||[]),...(sen.search||[])].forEach(x=>{ lbl[x.id] ||= x.label; });
    const ids = [...new Set([...(s.query?.search||[]).map(x=>x.title), ...Object.keys(lbl)])];
    if(!ids.length) return [];
    const chunks=[]; for(let i=0;i<ids.length;i+=50) chunks.push(ids.slice(i,i+50));
    const ents = {};
    (await Promise.all(chunks.map(c=>fetch(`${W}&action=wbgetentities&props=claims|labels|sitelinks&languages=de|en|mul&ids=${c.join('|')}`).then(r=>r.json()))))
      .forEach(e=>Object.assign(ents, e.entities||{}));
    const nq = tw.join(' ');
    const OK = new Set(['Q11424','Q202866','Q24869','Q506240','Q5398426','Q581714','Q1259759','Q93204','Q226730','Q17517379']);
    return ids.map(id=>ents[id]).filter(x=>x && (x.claims?.P31||[]).some(c=>OK.has(c.mainsnak?.datavalue?.value?.id))).map(x=>{
      const de=x.labels?.de?.value, en=x.labels?.en?.value||x.labels?.mul?.value||lbl[x.id];
      const words=tw;
      const imdb=x.claims?.P345?.[0]?.mainsnak?.datavalue?.value;
      const year=(x.claims?.P577?.[0]?.mainsnak?.datavalue?.value?.time||'').slice(1,5);
      let m=0;
      for(const t0 of [de,en].map(Finder.norm)){ if(!t0) continue;
        for(const t of [t0, t0.replace(/^(the|a|an|der|die|das|le|la|les|il|el) /,'')]){
        if(t===nq) m=Math.max(m,4); else if(t.startsWith(nq)) m=Math.max(m,3);
        else if(words.every(w=>t.split(' ').some(tw=>tw.startsWith(w)))) m=Math.max(m,2);
        else if(t.includes(nq)) m=Math.max(m,1); } }
      const pop=Object.keys(x.sitelinks||{}).length;
      return {imdbID:imdb, Title:de||en, Year:year, Poster:null, score:m*40+Math.min(pop,120), m};
    }).filter(r=>r.imdbID?.startsWith('tt') && r.m>0).sort((a,b)=>b.score-a.score);
  },
  async search(q){
    const [wd, om] = await Promise.all([
      Finder.wikidata(q).catch(()=>[]),
      Omdb.on() ? Omdb.search(q).catch(()=>[]) : Promise.resolve([])
    ]);
    const out=[], seen=new Set();
    const add=r=>{ if(r.imdbID && !seen.has(r.imdbID)){ seen.add(r.imdbID); out.push(r); } };
    wd.filter(r=>r.m>=3).forEach(add);
    om.forEach(r=>add({imdbID:r.imdbID,Title:r.Title,Year:r.Year,Poster:r.Poster!=='N/A'?r.Poster:null}));
    wd.forEach(add);
    return out.slice(0,10);
  },
  async poster(id){
    if(id in Finder.cache) return Finder.cache[id];
    try{ const d=await Omdb.details(id); Finder.cache[id]=d.poster; return d.poster; }catch(e){ return Finder.cache[id]=null; }
  }
};

/* ================= OMDb (Poster + externe Ratings) ================= */
const Omdb = {
  on: () => !!CONFIG.OMDB_KEY,
  async search(q){
    const r = await fetch(`https://www.omdbapi.com/?apikey=${CONFIG.OMDB_KEY}&type=movie&s=${encodeURIComponent(q)}`);
    const d = await r.json(); return d.Search || [];
  },
  async details(id){
    const r = await fetch(`https://www.omdbapi.com/?apikey=${CONFIG.OMDB_KEY}&i=${id}`);
    const d = await r.json(); if(d.Response==='False') throw new Error(d.Error);
    const find = s => (d.Ratings||[]).find(x=>x.Source===s)?.Value;
    return {
      imdb_id:d.imdbID, title:d.Title, year:parseInt(d.Year)||null,
      poster: d.Poster!=='N/A'?d.Poster:null,
      ext:{ imdb: d.imdbRating!=='N/A'?d.imdbRating:null, rt: find('Rotten Tomatoes')||null,
            mc: find('Metacritic')?.replace('/100','')||null, genre:d.Genre, director:d.Director, runtime:d.Runtime }
    };
  }
};

const Remote = {
  mode:'online', sb:null,
  async init(){ await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'); this.sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY); },
  async getUser(){
    const {data:{session}} = await this.sb.auth.getSession(); if(!session) return null;
    const u=session.user; const {data:p} = await this.sb.from('profiles').select('username').eq('id',u.id).maybeSingle();
    return {id:u.id,email:u.email,username:p?.username||u.user_metadata?.username||u.email.split('@')[0]};
  },
  async signIn(email,pw){ const {error}=await this.sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; return this.getUser(); },
  async signUp(email,pw,username){
    const {data,error}=await this.sb.auth.signUp({email,password:pw,options:{data:{username}}}); if(error) throw error;
    if(!data.session) throw new Error('Konto erstellt. Bitte bestätige deine E-Mail und melde dich dann an.');
    return this.getUser();
  },
  async signOut(){ await this.sb.auth.signOut(); },
  async list(){
    const {data,error}=await this.sb.from('ratings').select('*, profiles(username)').order('created_at',{ascending:false});
    if(error) throw error; return data.map(r=>({...r,username:r.profiles?.username}));
  },
  async save(r){
    const row={title:r.title,year:r.year,watched_on:r.watched_on||null,note:r.note,overall:avg(r),imdb_id:r.imdb_id||null,poster:r.poster||null,ext:r.ext||null};
    CRITERIA.forEach(c=>row[c.key]=r[c.key]);
    const q = r.id ? this.sb.from('ratings').update(row).eq('id',r.id) : this.sb.from('ratings').insert({...row,user_id:state.user.id});
    const {error}=await q; if(error) throw error;
  },
  async remove(id){ const {error}=await this.sb.from('ratings').delete().eq('id',id); if(error) throw error; },
  async setUsername(n){ const {error}=await this.sb.from('profiles').upsert({id:state.user.id,username:n}); if(error) throw error; state.user.username=n; }
};

async function refresh(){
  try{ state.ratings = await DB.list(); }catch(e){ toast('Laden fehlgeschlagen: '+e.message); }
  render();
}

function aggregate(rows){
  const m={};
  rows.forEach(r=>{ const k=filmKey(r); (m[k] ||= {key:k,title:r.title,year:r.year,poster:r.poster,ext:r.ext,list:[]}).list.push(r); if(!m[k].poster&&r.poster) m[k].poster=r.poster; if(!m[k].ext&&r.ext) m[k].ext=r.ext; });
  return Object.values(m).map(f=>({...f,overall:Math.round(f.list.reduce((a,r)=>a+avg(r),0)/f.list.length*10)/10,count:f.list.length,created_at:f.list[0].created_at}));
}

  $('#dock').style.display='flex';
  $('#tabbar').innerHTML = TABS.map(t=>`<button class="tab ${state.tab===t.id?'on':''}" data-t="${t.id}">${t.icon}<span>${t.label}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ if(state.tab!==b.dataset.t){ state.tab=b.dataset.t; tick(); render(); window.scrollTo({top:0}); } });
}

            ${extPills(r.ext, fmtsOf(r.count?r.list.find(x=>x.ext)||r.list[0]:r))}
          </div>
          ${ring(r._s)}
        </button>`).join('') : `<div class="empty">${I.pop}${emptyTxt}</div>`}
    </div>`;
  const qi=$('#q'); qi.oninput=()=>{ state.q=qi.value; const p=qi.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(p,p); };
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ state.sort=c.dataset.s; tick(); render(); });
  $('#prof').onclick=openProfile;
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.k));
}
function fmtDate(d){ if(!d) return ''; const x=new Date(d); return isNaN(x)?d:x.toLocaleDateString('de-CH',{day:'numeric',month:'short',year:'numeric'}); }

/* ================= Neu (Startseite im Netflix-Stil) ================= */
const KINO_URL = 'https://raw.githubusercontent.com/liasoer/filmrating/main/kino.json';
const GENRE_DE = {Action:'Action',Comedy:'Komödie',Drama:'Drama',Horror:'Horror',Thriller:'Thriller',Animation:'Animation',Family:'Familie',Fantasy:'Fantasy','Science-Fiction':'Science-Fiction','Science Fiction':'Science-Fiction',Romance:'Romantik',Documentary:'Dokumentarfilm',Adventure:'Abenteuer',Crime:'Krimi',Biopic:'Biografie',Musical:'Musik',Western:'Western',War:'Krieg'};
const FMT_ROWS = [['IMAX','In IMAX'],['4DX','In 4DX'],['D-BOX','Mit D-BOX Sitzen'],['Dolby Atmos','In Dolby Atmos'],['ScreenX','In ScreenX'],['3D','In 3D'],['VIP & Premium','VIP & Premium'],['Kinderkino','Kinderkino']];
async function loadKino(){
  if(state.kino) return state.kino;
  try{ const r = await fetch(KINO_URL+'?h='+new Date().toISOString().slice(0,13)); if(!r.ok) throw 0; const k = await r.json();
    k.all = [...(k.now||[]).map(m=>({...m,_soon:false})), ...(k.soon||[]).map(m=>({...m,_soon:true}))];
    state.kino = k; }
  catch(e){ state.kino = {now:[], soon:[], all:[], err:true}; }
  return state.kino;
}
const FMT_SHOW = ['IMAX','4DX','D-BOX','Dolby Atmos','ScreenX','3D'];
function fmtsOf(r){
  let f = r?.ext?.formats;
  if(!f && r?.imdb_id && state.kino?.all){ f = state.kino.all.find(m=>m.imdb_id===r.imdb_id)?.formats; }
  return (f||[]).filter(x=>FMT_SHOW.includes(x));
}
function friendsFor(m){ return m.imdb_id ? state.ratings.filter(r=>r.imdb_id===m.imdb_id) : []; }
const imdbNum = m => parseFloat(m.ext?.imdb)||0;
const genresDe = m => (m.genres||[]).map(g=>GENRE_DE[g]||g);
function badgeFor(m){ const f=(m.formats||[]).find(x=>x==='IMAX'||x==='4DX'||x==='ScreenX'); return f?`<span class="badge">${f}</span>`:''; }

function pcard(m){
  const fr=friendsFor(m); const a=fr.length?Math.round(fr.reduce((s,r)=>s+avg(r),0)/fr.length*10)/10:null;
  const sub = m._soon && m.release ? 'Ab '+fmtDate(m.release).replace(/ \d{4}$/,'') : genresDe(m)[0]||'';
  return `<button class="pcard" data-kid="${m._i}"><div class="poster" ${posterStyle(m.poster)}>${m.poster?'':I.film}${badgeFor(m)}${a!=null?`<div class="pring">${ring(a,'sm')}</div>`:''}</div><div class="pt">${esc(m.title)}</div><div class="pm">${esc(sub)}</div></button>`;
}
function row(title, list){ return list.length ? `<section><h3 class="rowh">${esc(title)}</h3><div class="rail">${list.map(pcard).join('')}</div></section>` : ''; }

function renderNeu(){
  const k = state.kino;
  if(!k) loadKino().then(()=>{ if(state.tab==='neu') render(); });
  const head = `<div class="hdr"><h1 class="large">Neu</h1><button class="glass glass-btn avatar" id="prof">${esc((state.user.username||'?')[0].toUpperCase())}</button></div>`;
  if(!k || k.err){
    $('#app').innerHTML = head + `<div class="empty">${!k?'Lade Kinoprogramm…':I.pop+'Das Kinoprogramm konnte nicht geladen werden.'}</div>`;
    $('#prof').onclick=openProfile; return;
  }
  const all = k.all.map((m,i)=>({...m,_i:i}));
  const now = all.filter(m=>!m._soon), soon = all.filter(m=>m._soon);
  const days = m => m.release ? (Date.now()-new Date(m.release))/864e5 : 999;
  let heroes = now.filter(m=>m.isNew || days(m)<=21).sort((a,b)=>(a.order||99)-(b.order||99)).slice(0,6);
  if(heroes.length<4) heroes = [...heroes, ...now.filter(m=>!heroes.includes(m)).slice(0,4-heroes.length)];
  const rated = all.filter(m=>friendsFor(m).length);
  const genres = {}; now.forEach(m=>genresDe(m).forEach(g=>(genres[g] ||= []).push(m)));
  const genreRows = Object.entries(genres).filter(([,l])=>l.length>=3).sort((a,b)=>b[1].length-a[1].length).slice(0,6);
  const best = now.filter(m=>imdbNum(m)>=7).sort((a,b)=>imdbNum(b)-imdbNum(a));
  const upd = k.updated ? new Date(k.updated).toLocaleDateString('de-CH',{day:'numeric',month:'long'}) : '';

  $('#app').innerHTML = head + `
    <div class="hero-rail">${heroes.map(m=>`
      <button class="hcard" data-kid="${m._i}" ${posterStyle(m.poster)}>
        <div class="badges">${m.isNew?'<span class="badge new">Neu</span>':''}${(m.formats||[]).filter(f=>f!=='VIP & Premium'&&f!=='Kinderkino').slice(0,2).map(f=>`<span class="badge">${f}</span>`).join('')}</div>
        <div class="hc-in">
          <div class="hc-t">${esc(m.title)}</div>
          <div class="hc-m">${[genresDe(m).slice(0,2).join(', '), m.duration?m.duration+' Min':''].filter(Boolean).map(esc).join(' · ')}</div>
          ${extPills(m.ext)}
        </div>
      </button>`).join('')}</div>
    ${row('Von Freunden bewertet', rated)}
    ${row('Jetzt im Kino', now)}
    ${row('Top bewertet auf IMDb', best)}
    ${FMT_ROWS.map(([f,t])=>row(t, all.filter(m=>(m.formats||[]).includes(f)))).join('')}
    ${genreRows.map(([g,l])=>row(g,l)).join('')}
    ${row('Auf Englisch', now.filter(m=>(m.languages||[]).includes('Englisch')))}
    ${row('Demnächst im Kino', soon)}
    <div class="hint" style="text-align:center;margin-top:26px">Programm von ${esc(k.source||'cineman.ch')}${upd?', aktualisiert am '+esc(upd):''}</div>`;
  $('#prof').onclick=openProfile;
  document.querySelectorAll('[data-kid]').forEach(c=>c.onclick=()=>openKino(k.all[+c.dataset.kid]));
}

function openKino(m){
  const fr = friendsFor(m), mine = fr.find(r=>r.user_id===state.user.id), others = fr.filter(r=>r!==mine);
  const a = fr.length ? Math.round(fr.reduce((s,r)=>s+avg(r),0)/fr.length*10)/10 : null;
  openSheet({ body:`
    <div class="hero">
      <div class="hero-bg" ${posterStyle(m.backdrop||m.poster)}></div>
      <div class="hero-in">
        <div class="poster" ${posterStyle(m.poster)}>${m.poster?'':I.film}</div>
        <h2>${esc(m.title)}</h2>
        <div class="meta">${[genresDe(m).join(', '), m.duration?m.duration+' Min':'', m.age?'Ab '+m.age.split('/')[0]:''].filter(Boolean).map(esc).join(' · ')}</div>
        ${m.release?`<div class="meta">${new Date(m.release)>new Date()?'Kinostart':'Im Kino seit'} ${esc(fmtDate(m.release))}</div>`:''}
        ${a!=null?`<div class="scorerow">${ring(a,'xl')}<div class="lbl"><b>Eure Wertung</b>${fr.length} Bewertung${fr.length>1?'en':''}</div></div>`:''}
        ${extPills(m.ext)}
        ${(m.formats||[]).length?`<div class="ext">${m.formats.map(f=>`<span class="pill fmt">${esc(f)}</span>`).join('')}</div>`:''}
      </div>
    </div>
    ${mine ? `<button class="btn sec2" id="kd">Deine Bewertung ansehen</button>` : `<button class="btn pri" id="kr" style="margin-top:20px">Film bewerten</button>`}
    <a class="btn sec2" href="${esc(m.url||'https://www.cineman.ch')}" target="_blank" rel="noopener" style="display:grid;place-items:center;text-decoration:none">Kinoprogramm & Tickets${(m.url||'').includes('cineman')?' (Cineman)':''}</a>
    ${m.synopsis && !/plot unknown|^n\/a$/i.test(m.synopsis)?`<div class="sec">Inhalt</div><div class="grp"><div class="cell" style="font-size:15px;line-height:1.45">${esc(m.synopsis)}</div></div>`:''}
    <div class="sec">Details</div>
    <div class="grp">
      ${(m.directors||[]).length?`<div class="cell cell-h"><span>Regie</span><b style="text-align:right">${esc(m.directors.join(', '))}</b></div>`:''}
      ${(m.cast||[]).filter(Boolean).length?`<div class="cell"><div style="color:var(--t2);font-size:14px">Besetzung</div><div style="margin-top:4px">${esc(m.cast.join(', '))}</div></div>`:''}
      ${(m.languages||[]).length?`<div class="cell cell-h"><span>Sprachen</span><b style="text-align:right">${esc(m.languages.join(', '))}</b></div>`:''}
    </div>
    ${others.length?`<div class="sec">Freunde</div><div class="grp">`+others.map(r=>`
      <div class="cell"><div class="cell-h"><b>${esc(r.username||'Unbekannt')}</b>${ring(avg(r),'sm')}</div>${bars(r)}${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div>`).join('')+`</div>`:''}
  `});
  if(mine) $('#kd').onclick=()=>{ closeSheet(); setTimeout(()=>openDetail(filmKey(mine)),350); };
  else $('#kr').onclick=()=>openForm({title:m.title, year:parseInt(m.release)||null, poster:m.poster, imdb_id:m.imdb_id||null, ext:{...(m.ext||{}), formats:m.formats||[]}});
}

/* ================= Freunde einladen ================= */
async function invite(){
  const url = location.origin + location.pathname;
  const text = 'Bewerte mit mir Filme in Filmrating! Registrier dich hier:';
  try{ if(navigator.share){ await navigator.share({title:'Filmrating', text, url}); return; } }catch(e){ if(e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text+' '+url); toast('Link kopiert'); }catch(e){ toast(url); }
}

/* ================= Sheets ================= */
function openSheet({title='', right='', body, footer='', swipe=true}){
  const sh=$('#sheet'); sh.classList.remove('wiz');
  sh.innerHTML = `<div class="grab"></div><div class="sh-bar"><button class="glass glass-btn" id="shx" aria-label="Schliessen">${I.close}</button><h3>${title}</h3><div style="min-width:44px;display:flex;justify-content:flex-end">${right}</div></div><div class="sh-body" id="shb">${body}</div>${footer?`<div class="sh-foot" id="shf">${footer}</div>`:''}`;
  requestAnimationFrame(()=>{ $('#ov').classList.add('open'); sh.classList.add('open'); });
  document.body.classList.add('lock');
  $('#shx').onclick=closeSheet;
  // nach unten wischen zum Schliessen
  let y0=null, dy=0; const b=$('#shb');
  sh.ontouchstart=e=>{ if(swipe && b.scrollTop<=0 && !e.target.closest('input,textarea,button')) { y0=e.touches[0].clientY; dy=0; } };
  sh.ontouchmove=e=>{ if(y0==null) return; dy=e.touches[0].clientY-y0; if(dy>0){ sh.style.transition='none'; sh.style.transform=`translateY(${dy}px)`; } };
  sh.ontouchend=()=>{ if(y0==null) return; sh.style.transition=''; sh.style.transform=''; if(dy>120) closeSheet(); y0=null; };
}
function closeSheet(){ $('#ov').classList.remove('open'); $('#sheet').classList.remove('open'); setTimeout(()=>{ if(!$('#sheet').classList.contains('open')) $('#sheet').classList.remove('wiz'); },450); document.body.classList.remove('lock'); document.activeElement?.blur(); }
$('#ov').onclick=closeSheet;
$('#add').onclick=()=>{ tick(); openForm(); };

function bars(r){
  return `<div class="bars">${CRITERIA.map(c=>`<span>${c.label}</span><div class="bar"><i style="width:${(+r[c.key])*10}%;background:${col(+r[c.key])}"></i></div><b>${f1(r[c.key])}</b>`).join('')}</div>`;
}

function openDetail(key){
  const list = state.ratings.filter(r=>filmKey(r)===key);
  if(!list.length) return;
  const f = list.find(r=>r.poster) || list[0];
  const e = list.find(r=>r.ext)?.ext;
  const mine = list.find(r=>r.user_id===state.user.id);
  const others = list.filter(r=>r!==mine);
  const all = Math.round(list.reduce((a,r)=>a+avg(r),0)/list.length*10)/10;
  openSheet({ body:`
    <div class="hero">
      <div class="hero-bg" ${posterStyle(f.poster)}></div>
      <div class="hero-in">
        <div class="poster" ${posterStyle(f.poster)}>${f.poster?'':I.film}</div>
        <h2>${esc(f.title)}</h2>
        <div class="meta">${[f.year,e?.genre,e?.runtime].filter(Boolean).map(esc).join(' · ')}</div>
        ${e?.director?`<div class="meta">Regie: ${esc(e.director)}</div>`:''}
        <div class="scorerow">${ring(all,'xl')}<div class="lbl"><b>Gesamtschnitt</b>${list.length} Bewertung${list.length>1?'en':''}</div></div>
        ${extPills(e, fmtsOf(list.find(x=>x.ext)||f))}
      </div>
    </div>
    ${mine?`
      <div class="sec">Deine Bewertung</div>
      <div class="grp"><div class="cell"><div class="cell-h"><b>${fmtDate(mine.watched_on)||'Gesehen'}</b>${ring(avg(mine),'sm')}</div>${bars(mine)}${mine.note?`<div class="note">${esc(mine.note)}</div>`:''}</div></div>
      <button class="btn sec2" id="ed">Bewertung bearbeiten</button>`
     :`<button class="btn pri" id="rate" style="margin-top:22px">Diesen Film bewerten</button>`}
    ${others.length?`<div class="sec">Freunde</div><div class="grp">`+others.map(r=>`
      <div class="cell"><div class="cell-h"><b>${esc(r.username||'Unbekannt')}</b>${ring(avg(r),'sm')}</div>${bars(r)}${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div>`).join('')+`</div>`:''}
  `});
  if(mine) $('#ed').onclick=()=>openForm(mine);
  else $('#rate').onclick=()=>openForm({title:f.title,year:f.year,poster:f.poster,imdb_id:f.imdb_id,ext:e});
}

function openForm(r){
  const isEdit = !!r?.id;
  const d = r ? {...r} : {watched_on:new Date().toISOString().slice(0,10)};
  CRITERIA.forEach(c=>{ if(d[c.key]==null) d[c.key]=7; });
  const HINT = {story:'Handlung, Spannung, Ende', camera:'Bildsprache, Effekte, Farben', music:'Soundtrack, Score, Sound', acting:'Schauspiel und Besetzung', fun:'Spass, Tempo, Kurzweil'};
  const steps = ['film', ...CRITERIA.map(c=>c.key), 'done'];
  let i = d.title ? 1 : 0, dir = 1;

  openSheet({ swipe:false, title:`<div class="prog" id="prog"></div>`, body:`<div id="wz"></div>`, footer:`<button class="btn pri" id="nx" style="margin:0">Weiter</button>` });
  $('#sheet').classList.add('wiz'); $('#sheet').insertAdjacentHTML('afterbegin','<div class="wz-bg" id="wzbg"></div>');
  const go = n => { dir = n>i?1:-1; i = n; tick(); draw(); };

  function draw(){
    const st = steps[i];
    $('#prog').innerHTML = steps.map((s,k)=>`<i class="${k<i?'d':k===i?'on':''}"></i>`).join('');
    const x = $('#shx');
    if(i===0 || (i===1 && r?.title)){ x.innerHTML = I.close; x.onclick = closeSheet; }
    else { x.innerHTML = I.back; x.onclick = ()=>go(i-1); }
    const nx = $('#nx'), foot = $('#shf');
    foot.style.display = st==='film' ? 'none' : '';
    const wz = $('#wz');
    wz.className = 'wz '+(dir>0?'in-r':'in-l');
    void wz.offsetWidth;

    if(st==='film'){
      wz.innerHTML = `<h2 class="wz-h">Welchen Film hast du gesehen?</h2>
        <label class="search" style="margin-top:18px">${I.search}<input id="fs" type="search" placeholder="Titel suchen" enterkeyhint="search" autocomplete="off" autocorrect="off"></label>
        <div class="grp" id="sr" style="margin-top:12px;display:none"></div>
        <div style="text-align:center;margin-top:18px"><button class="link" id="man">Film manuell eintragen</button></div>`;
      setTimeout(()=>$('#fs')?.focus(), 350);
      let t, seq=0;
      $('#fs').oninput=e=>{ clearTimeout(t); const q=e.target.value.trim(); const sr=$('#sr'); if(q.length<2){ sr.style.display='none'; sr.innerHTML=''; return; }
        t=setTimeout(async()=>{ const my=++seq; sr.style.display=''; sr.innerHTML='<div class="hint" style="padding:14px 0">Suche…</div>';
          try{ const res=await Finder.search(q); if(my!==seq) return;
            sr.innerHTML = res.length ? res.map(m=>`<button class="res" data-id="${m.imdbID}" data-t="${esc(m.Title)}" data-y="${esc(m.Year||'')}"><div class="poster" data-p="${m.imdbID}" ${posterStyle(m.Poster)}>${m.Poster?'':I.film}</div><div class="info"><div class="title">${esc(m.Title)}</div><div class="meta">${esc(m.Year||'')}</div></div></button>`).join('') : `<div class="hint" style="padding:14px 0">Nichts gefunden.</div>`;
            document.querySelectorAll('.res').forEach(b=>b.onclick=async()=>{
              document.activeElement?.blur();
              d.title=b.dataset.t; d.year=parseInt(b.dataset.y)||null; d.imdb_id=b.dataset.id;
              const p=b.querySelector('.poster').style.backgroundImage.match(/url\(["']?(.*?)["']?\)/); d.poster=p?p[1]:null;
              if(Omdb.on()){ try{ const x=await Omdb.details(b.dataset.id); d.ext=x.ext; d.poster=x.poster||d.poster; d.year=x.year||d.year; }catch(e){} }
              const dup=state.ratings.find(x=>x.user_id===state.user.id&&filmKey(x)===filmKey(d));
              if(dup && !isEdit){ Object.assign(d, {...dup, poster:d.poster||dup.poster, ext:d.ext||dup.ext}); toast('Du hast diesen Film schon bewertet, du bearbeitest ihn jetzt'); }
              go(1);
            });
            if(Omdb.on()) res.filter(m=>!m.Poster).slice(0,6).forEach(async m=>{ const p=await Finder.poster(m.imdbID); const el=document.querySelector(`[data-p="${m.imdbID}"]`); if(p&&el){ el.style.backgroundImage=`url('${p}')`; el.innerHTML=''; } });
          }catch(err){ if(my===seq) sr.innerHTML='<div class="hint" style="padding:14px 0">Suche fehlgeschlagen.</div>'; }
        },300); };
      $('#man').onclick=()=>{
        wz.innerHTML = `<h2 class="wz-h">Film eintragen</h2>
          <div class="grp" style="margin-top:18px"><div class="field"><label>Titel</label><input id="ft" placeholder="Filmtitel" value="${esc(d.title||'')}"></div><div class="field"><label>Jahr</label><input id="fy" inputmode="numeric" placeholder="2026" value="${esc(d.year||'')}"></div></div>`;
        foot.style.display=''; nx.textContent='Weiter';
        nx.onclick=()=>{ d.title=$('#ft').value.trim(); d.year=parseInt($('#fy').value)||null; if(!d.title) return toast('Bitte einen Titel eingeben'); d.imdb_id=null; d.poster=null; d.ext=null; go(1); };
        setTimeout(()=>$('#ft').focus(),50);
      };
      return;
    }

    const bg=$('#wzbg'); if(bg) bg.style.backgroundImage = d.poster?`url('${d.poster}')`:'';
    const fm = fmtsOf(d);
    const filmHead = `<div class="wz-film"><div class="poster" ${posterStyle(d.poster)}>${d.poster?'':I.film}</div><div class="info"><div class="title">${esc(d.title)}</div><div class="meta">${esc(d.year||'')}</div>${fm.length?`<div class="ext">${fm.map(f=>`<span class="pill fmt">${esc(f)}</span>`).join('')}</div>`:''}</div></div>`;
    const WORD = v => v<3?'Schlecht':v<5?'Schwach':v<6.5?'Okay':v<8?'Gut':v<9.5?'Sehr gut':'Meisterwerk';

    if(st!=='done'){
      const c = CRITERIA.find(c=>c.key===st), n = steps.indexOf(st);
      wz.innerHTML = `${filmHead}
        <div class="wz-crit">
          <div class="wz-step">${n} von ${CRITERIA.length}</div>

          <div class="hint" style="margin:6px 0 0;text-align:center">${HINT[c.key]||''}</div>
          <div class="meter" id="mt"><div class="meter-in"><div class="wz-val" id="wv">${f1(d[st])}</div><div class="wz-word" id="ww"></div></div></div>
          <div class="wz-ctl">
            <button class="glass glass-btn" id="mn" aria-label="Weniger">${I.minus}</button>
            <input type="range" min="1" max="10" step="0.5" id="rg" value="${d[st]}" aria-label="${c.label}">
            <button class="glass glass-btn" id="pl" aria-label="Mehr">${I.plus}</button>
          </div>
          <div class="ticks" style="padding:0 64px;width:100%"><span>1</span><span>10</span></div>
        </div>`;
      const rg=$('#rg'), wv=$('#wv'), mt=$('#mt'), ww=$('#ww');
      const set=v=>{ v=Math.min(10,Math.max(1,Math.round(v*2)/2)); if(v!==d[st]) tick(); d[st]=v; rg.value=v; wv.textContent=f1(v); ww.textContent=WORD(v); ww.style.color=col(v); mt.style.setProperty('--v',v*10); mt.style.setProperty('--c',col(v)); rg.style.setProperty('--p',((v-1)/9*100)+'%'); };
      rg.oninput=()=>set(+rg.value); $('#mn').onclick=()=>set(d[st]-0.5); $('#pl').onclick=()=>set(d[st]+0.5);
      set(d[st]);
      nx.textContent = 'Weiter'; nx.onclick=()=>go(i+1);
      return;
    }

    // Zusammenfassung
    wz.innerHTML = `${filmHead}
      <div class="meter sm" style="--v:${avg(d)*10};--c:${col(avg(d))};margin:26px auto 6px"><div class="meter-in"><div class="wz-val" style="color:var(--t1)">${f1(avg(d))}</div><div class="wz-word" style="color:${col(avg(d))}">${WORD(avg(d))}</div></div></div>
      <div class="hint" style="text-align:center;margin:0 0 4px">Deine Gesamtnote</div>
      <div class="grp" style="margin-top:16px">${CRITERIA.map((c,k)=>`<button class="cell cell-h" data-go="${k+1}" style="width:100%;text-align:left"><span>${c.label}</span><span style="display:flex;align-items:center;gap:10px"><b style="color:${col(d[c.key])}">${f1(d[c.key])}</b><span style="color:var(--t3)">${I.chev}</span></span></button>`).join('')}</div>
      <div class="grp" style="margin-top:12px"><div class="field"><label for="fd">Gesehen am</label><input type="date" id="fd" value="${esc(d.watched_on||'')}"></div></div>
      <div class="sec">Notiz</div>
      <div class="grp"><textarea class="ta" id="fn" placeholder="Was ist dir aufgefallen? (optional)">${esc(d.note||'')}</textarea></div>
      ${d.id?'<button class="btn red" id="dl" style="margin-top:22px">Bewertung löschen</button>':''}`;
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
    $('#fd').onchange=e=>d.watched_on=e.target.value; $('#fn').oninput=e=>d.note=e.target.value;
    nx.textContent='Bewertung sichern';
    nx.onclick=async()=>{
      d.note=($('#fn').value||'').trim(); d.overall=avg(d);
      nx.disabled=true;
      try{ await DB.save(d); closeSheet(); toast('Gespeichert'); state.tab='mine'; await refresh(); }catch(e){ toast('Fehler: '+e.message); nx.disabled=false; }
    };
    if(d.id) $('#dl').onclick=async()=>{ try{ await DB.remove(d.id); closeSheet(); toast('Gelöscht'); await refresh(); }catch(e){ toast(e.message); } };
  }
  draw();
}

function openProfile(){
  const mine=state.ratings.filter(r=>r.user_id===state.user.id);
  const a=mine.length?Math.round(mine.reduce((s,r)=>s+avg(r),0)/mine.length*10)/10:0;
  openSheet({ title:'Profil', body:`
    <div style="text-align:center;margin:10px 0 6px">
      <div class="glass glass-btn avatar" style="width:84px;height:84px;margin:0 auto;font-size:34px">${esc((state.user.username||'?')[0].toUpperCase())}</div>
      <h2 style="font:800 24px/1.2 var(--f);margin-top:14px">${esc(state.user.username||'')}</h2>
      <div class="meta">${esc(state.user.email||'')}</div>
    </div>
    <div class="grp" style="margin-top:20px"><div class="cell cell-h"><span>Bewertete Filme</span><b>${mine.length}</b></div><div class="cell cell-h"><span>Dein Schnitt</span>${ring(a,'sm')}</div></div>
    <div class="sec">Freunde</div>
    <button class="btn pri" id="inv" style="margin-top:0;display:flex;align-items:center;justify-content:center;gap:8px">${I.share}Freunde einladen</button>
    <div class="hint">Schick deinen Freunden den Link. Sobald sie sich registrieren, siehst du ihre Bewertungen im Tab «Freunde».</div>
    <div class="sec">Dein Name für Freunde</div>
    <div class="grp"><div class="field"><input id="pn" style="text-align:left;color:var(--t1)" value="${esc(state.user.username||'')}" autocomplete="nickname"></div></div>
    <button class="btn sec2" id="ps">Name sichern</button>
    <div class="sec">App installieren</div>
    <div class="grp"><div class="cell note" style="margin:0">iPhone: In Safari auf Teilen tippen, dann «Zum Home-Bildschirm».</div></div>
    <button class="btn red" id="lo" style="margin-top:24px">Abmelden</button>
    ${DB.mode==='demo'?'<div class="demo">Demo-Modus aktiv.</div>':''}
  `});
  $('#inv').onclick=invite;
  $('#ps').onclick=async()=>{ try{ await DB.setUsername($('#pn').value.trim()); toast('Gespeichert'); closeSheet(); await refresh(); }catch(e){toast(e.message);} };
  $('#lo').onclick=async()=>{ await DB.signOut(); state.user=null; closeSheet(); renderAuth(); };
}

/* ================= Auto-Update ================= */
const APP_VERSION = '18';
async function checkUpdate(){
  try{
    const t = await fetch(location.pathname+'?nocache='+Date.now(), {cache:'no-store'}).then(r=>r.text());
    const v = (t.match(/APP_VERSION = '(\d+)'/)||[])[1];
    if(v && v!==APP_VERSION){ location.replace(location.pathname+'?v='+v); }
  }catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });

/* ================= Start ================= */
(async()=>{
  try{ await DB.init(); state.user = await DB.getUser(); }catch(e){ toast(e.message); }
  state.user ? refresh() : renderAuth();
  loadKino().then(()=>{ if(state.user) render(); });
})();
</script>
