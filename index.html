<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screenreview">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="apple-touch-icon" href="icon.png?v=4">
<link rel="icon" href="icon.png?v=4">
<title>Screenreview</title>
<style>
:root{
  --bg:#000;--bg2:#0d0d10;--grp:#1c1c1e;--grp2:#2c2c2e;--sep:rgba(84,84,88,.45);
  --t1:#fff;--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.32);
  --tint:#0a84ff;--tint2:#5e5ce6;
  --ok:#30d158;--mid:#ffd60a;--low:#ff9f0a;--bad:#ff453a;
  --glass:rgba(40,40,46,.62);--glass-b:rgba(255,255,255,.14);
  --sa-t:env(safe-area-inset-top);--sa-b:env(safe-area-inset-bottom);
  --r-xl:34px;--r-l:26px;--r-m:18px;--r-s:12px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{min-height:100%;min-height:100lvh;background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--t1);font:17px/1.35 var(--f);letter-spacing:-.2px;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;font-size:17px;color:var(--t1)}
svg{display:block}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 0 0 .5px var(--glass-b),0 10px 30px rgba(0,0,0,.35)}
.glass-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.glass-btn:active{transform:scale(.88)}

/* ---------- Hintergrund-Glow ---------- */
.glow{position:fixed;inset:-20% -20% auto;height:60vh;pointer-events:none;z-index:0;
  background:radial-gradient(50% 50% at 25% 30%,rgba(10,132,255,.22),transparent 70%),radial-gradient(45% 45% at 80% 20%,rgba(94,92,230,.18),transparent 70%);filter:blur(10px)}

/* ---------- Layout ---------- */
#app,#neu{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:calc(var(--sa-t) + 26px) 16px calc(var(--sa-b) + 96px)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}
.hdr .large{margin:0}
.hdr .avatar{width:40px;height:40px;flex:none}
.navbar{display:flex;justify-content:flex-end;align-items:center;height:48px;gap:10px}
.avatar{font-weight:700;font-size:17px;color:#4da3ff}
.large{font:800 34px/1.1 var(--f);letter-spacing:-.8px;margin:2px 4px 14px}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;padding:0 14px;background:rgba(118,118,128,.24)}
.search input{flex:1;background:none;border:0;outline:none;min-width:0;height:100%}
.search input::placeholder{color:var(--t2)}
.chips{display:flex;gap:8px;margin:12px -16px 4px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:17px;font-size:15px;font-weight:600;color:var(--t2);background:rgba(118,118,128,.18);transition:all .2s}
.chip.on{color:#000;background:var(--t1)}

/* ---------- Liste ---------- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 12px 10px 10px;border-radius:var(--r-l);
  background:rgba(38,38,44,.55);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.10),0 8px 24px rgba(0,0,0,.35);transition:transform .2s cubic-bezier(.3,1.3,.5,1)}
.card-bg{position:absolute;inset:-30px;z-index:-1;background:center/cover;filter:blur(28px) saturate(170%) brightness(.55);opacity:.85;transform:scale(1.1)}
.card-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(20,20,24,.15) 0%,rgba(20,20,24,.55) 55%,rgba(20,20,24,.8) 100%)}
.card .ring span{background:rgba(18,18,22,.72)}
.card .pill{background:rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
.card .meta{color:rgba(255,255,255,.7)}
.card:active{transform:scale(.975)}
.poster{flex:none;width:64px;height:96px;border-radius:14px;background:#26262b center/cover;display:grid;place-items:center;color:var(--t3);overflow:hidden;box-shadow:0 0 0 .5px rgba(255,255,255,.08)}
.info{flex:1;min-width:0}
.title{font-weight:650;font-size:17px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--t2);font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ext{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;color:var(--t2);background:rgba(118,118,128,.2);white-space:nowrap}
.pill b{color:var(--t1);font-weight:700}
.rank{flex:none;width:22px;text-align:center;font-weight:800;color:var(--t3);font-size:15px}

/* Score-Ring */
.ring{--v:0;--c:var(--ok);flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(255,255,255,.1) 0)}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--grp);display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:-.3px}
.ring.xl{width:84px;height:84px}
.ring.xl span{width:70px;height:70px;font-size:26px;background:#121214}
.ring.sm{width:40px;height:40px}
.ring.sm span{width:32px;height:32px;font-size:13px;background:#2a2a2e}

.empty{text-align:center;color:var(--t2);padding:70px 24px;font-size:16px}
.empty svg{margin:0 auto 14px;opacity:.5}

/* ---------- Schwebende Tab-Leiste ---------- */
.dock{position:fixed;left:0;right:0;bottom:max(12px, calc(var(--sa-b) - 14px));z-index:10;display:flex;justify-content:center;align-items:center;gap:12px;padding:0 16px;pointer-events:none}
.tabbar,.addbtn{background:rgba(28,28,34,.46);-webkit-backdrop-filter:blur(28px) saturate(210%) brightness(1.08);backdrop-filter:blur(28px) saturate(210%) brightness(1.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30),inset 0 -1px 1px rgba(255,255,255,.07),inset 0 0 0 .5px rgba(255,255,255,.20),inset 0 0 18px rgba(255,255,255,.04),0 14px 34px rgba(0,0,0,.5)}
.tabbar{pointer-events:auto;position:relative;display:flex;height:62px;border-radius:31px;padding:4px;flex:1;max-width:370px;touch-action:none;-webkit-user-select:none;user-select:none}
.tab{position:relative;z-index:1;flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--t1);opacity:.78;pointer-events:none;
  transition:transform .3s cubic-bezier(.3,1.5,.4,1),color .2s,opacity .2s}
.tab.on{opacity:1;color:#4da3ff}
.tab.hover{transform:scale(1.14);opacity:1;color:#fff}
.tabbar.drag .tab.on:not(.hover){color:var(--t1);opacity:.78}
.lens{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:var(--w,80px);border-radius:27px;will-change:transform;transform:translate3d(4px,0,0);
  background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.12);
  transition:transform .5s cubic-bezier(.25,1.45,.4,1),background .2s,box-shadow .2s}
/* live: folgt dem Finger ohne Verzögerung */
.tabbar.drag.live .lens{transition:background .2s,box-shadow .2s}
.tabbar.drag .lens{transition:transform .16s cubic-bezier(.3,1.4,.5,1),background .2s,box-shadow .2s;background:rgba(255,255,255,.16);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 2px rgba(255,255,255,.18),inset 3px 0 4px rgba(255,90,140,.32),inset -3px 0 4px rgba(90,180,255,.42),0 10px 26px rgba(0,0,0,.4)}
.addbtn{pointer-events:auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#4da3ff;background:rgba(28,28,34,.62);transition:transform .3s cubic-bezier(.3,1.5,.4,1)}
.addbtn:active{transform:scale(.9)}

/* ---------- Sheets ---------- */
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;top:calc(var(--sa-t) + 12px);bottom:0;z-index:31;max-width:680px;margin:0 auto;background:#111113;border-radius:var(--r-xl) var(--r-xl) 0 0;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -0.5px 0 rgba(255,255,255,.15)}
.sheet.open{transform:none}
.sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:200px;background:#111113}
.sh-bar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.sh-bar h3{font-size:17px;font-weight:650}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:68px 16px calc(var(--sa-b) + 30px)}
.grab{position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:rgba(255,255,255,.28);z-index:4}
.done{height:44px;padding:0 18px;border-radius:22px;font-weight:650;color:#fff;background:var(--tint)}
.done:active{transform:scale(.94)}

/* Detail-Hero */
.hero{position:relative;margin:-68px -16px 0;padding:74px 20px 22px;overflow:hidden}
.hero-bg{position:absolute;inset:-40px;background:center/cover;filter:blur(40px) saturate(160%) brightness(.55);transform:scale(1.2)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,#111113 92%)}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero .poster{width:150px;height:225px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12)}
.hero h2{font:800 26px/1.15 var(--f);letter-spacing:-.5px;margin-top:18px}
.hero .meta{white-space:normal;margin-top:6px}
.hero .ext{justify-content:center}
.scorerow{display:flex;align-items:center;gap:14px;margin-top:18px}
.scorerow .lbl{text-align:left;color:var(--t2);font-size:14px}
.scorerow .lbl b{display:block;color:var(--t1);font-size:17px}

/* Gruppierte Listen */
.sec{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.3px;margin:24px 16px 8px}
.grp{background:rgba(44,44,50,.55);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-radius:var(--r-l);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 .5px rgba(255,255,255,.08)}
.grp+.grp{margin-top:12px}
.cell{padding:14px 16px;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cell-h b{font-weight:650}
.note{color:var(--t2);font-size:15px;margin-top:8px;white-space:pre-wrap}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14px;color:var(--t2);margin-top:10px}
.bars b{color:var(--t1);font-weight:700;min-width:30px;text-align:right}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--tint)}
.btn{display:block;width:100%;height:52px;border-radius:26px;font-weight:650;font-size:17px;margin-top:14px}
.btn.pri{color:#fff;background:var(--tint)}
.btn.sec2{background:var(--grp);color:var(--tint)}
.btn.red{background:var(--grp);color:var(--bad)}
.btn:active{transform:scale(.97);opacity:.85}

/* Formular */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 16px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.field label{color:var(--t1)}
.field input{background:none;border:0;outline:none;text-align:right;color:var(--t2);min-width:0;flex:1}
.field input[type=date]{-webkit-appearance:none;appearance:none;flex:none;background:rgba(118,118,128,.24);border-radius:8px;padding:6px 10px;color:var(--t1);text-align:center}
.crit{padding:14px 16px 10px;position:relative}
.crit+.crit::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.crit .h{display:flex;justify-content:space-between;align-items:baseline}
.crit .v{font-weight:800;font-size:22px;color:var(--tint);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:2px 0 0;touch-action:pan-y}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--tint) var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.1)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--tint)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);padding:0 6px}
textarea.ta{width:100%;min-height:96px;background:none;border:0;outline:none;resize:none;padding:14px 16px;color:var(--t1)}
textarea.ta::placeholder,.field input::placeholder{color:var(--t3)}
.total{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.total b{font-size:17px}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;position:relative}
.res+.res::before{content:"";position:absolute;top:0;left:70px;right:0;height:.5px;background:var(--sep)}
.res:active{background:var(--grp2)}
.res .poster{width:42px;height:63px;border-radius:9px}
.picked{display:flex;align-items:center;gap:14px;padding:12px}
.picked .poster{width:64px;height:96px}
.link{color:var(--tint);font-weight:600}
.hint{color:var(--t2);font-size:13px;margin:8px 16px 0}


/* Hinweis auf offene Freundschaftsanfragen */
.avatar.badge-dot::after{content:"";position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:#ff453a;box-shadow:0 0 0 2px #000}

.stepn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:rgba(10,132,255,.2);color:#4da3ff}
.grp .cell svg{display:inline-block;vertical-align:-3px;width:17px;height:17px}
.inst-banner{margin:0 0 16px}
.inst-banner #insthide svg{width:14px;height:14px}

.dev-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.dev-stats div{background:rgba(44,44,50,.55);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.dev-stats b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px}
.dev-stats span{font-size:12px;color:var(--t2)}

.tgl{flex:none;width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);position:relative;transition:background .25s}
.tgl i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.tgl.on{background:#30d158}
.tgl.on i{transform:translateX(20px)}
.tgl:disabled{opacity:.4}

/* Umschalter Filme / Serien */
.seg{position:relative;display:flex;padding:3px;border-radius:14px;background:rgba(118,118,128,.24);height:40px}
.seg button{position:relative;z-index:1;flex:1;border-radius:11px;font-size:15px;font-weight:600;color:var(--t2);transition:color .2s}
.seg button.on{color:var(--t1)}
.seg-ind{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:11px;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 8px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
#mk button.on{background:rgba(255,255,255,.18);color:var(--t1)}

/* Neu: Netflix-Startseite */
.hero-rail{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hero-rail::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.hcard{flex:none;position:relative;width:232px;height:348px;padding:0;align-self:flex-start;border-radius:22px;overflow:hidden;scroll-snap-align:start;background:#1c1c1e center/cover;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.1);transition:transform .25s}
.hcard.pressed{opacity:.85}
.hcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 22%,transparent 45%,rgba(0,0,0,.92) 100%)}
.hc-in{position:absolute;left:0;right:0;bottom:0;padding:14px;z-index:1}
.hc-in .ext{gap:4px}
.hc-t{font:800 21px/1.12 var(--f);letter-spacing:-.4px}
.hc-m{font-size:14px;color:rgba(255,255,255,.75);margin-top:6px}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:1}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:800;letter-spacing:.3px;color:#fff;background:rgba(20,20,24,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.badge.new{color:#fff;background:var(--tint)}
.rowh{font:700 21px/1.2 var(--f);letter-spacing:-.4px;margin:28px 2px 10px}
.rail{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pcard{flex:none;width:116px;text-align:left;scroll-snap-align:start;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;align-self:flex-start;padding:0}
.pcard .poster{width:116px;height:174px;min-height:174px;max-height:174px;border-radius:14px;position:relative}
.pcard .badge{position:absolute;top:6px;left:6px;height:18px;padding:0 6px;font-size:9.5px;background:rgba(20,20,24,.72);-webkit-backdrop-filter:none;backdrop-filter:none}
.pcard .poster{overflow:hidden}
.pcard .poster img{width:100%;height:100%;object-fit:cover;display:block}
#neu section{content-visibility:auto;contain-intrinsic-size:auto 250px}
#neu section.genre-sec{content-visibility:visible}
#neu section.watch-sec{content-visibility:visible;margin-bottom:26px}
#neu .watch-sec .rowh{margin-top:8px}
.watch-empty{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-radius:16px;text-align:left;color:var(--t2);font-size:14px;line-height:1.35}
.watch-empty svg{width:20px;height:20px;flex:none;color:var(--tint)}
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.wbtn svg{width:20px;height:20px}
.pushask{display:flex;flex-direction:column;align-items:center;padding-top:28px}

// Haptisches Feedback: iPhone (ab iOS 18) über einen Systemschalter, dessen Umschalten Safari mit einem Tick quittiert; Android über vibrate

})();
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800); }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Script konnte nicht geladen werden')); document.head.appendChild(s); }); }
const I = {
  bell:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>',

  pop:'<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l-1.6 11.2a1 1 0 0 1-1 .8H7.6a1 1 0 0 1-1-.8z"/><path d="M5 9a2.5 2.5 0 0 1 2-4 3 3 0 0 1 5-1 3 3 0 0 1 5 1 2.5 2.5 0 0 1 2 4"/><path d="M10 13v5M14 13v5"/></svg>'
};

function extPills(e, fm=[]){
  const p=fm.map(f=>`<span class="pill fmt">${esc(f)}</span>`);
  if(!e) return p.length?`<div class="ext">${p.join('')}</div>`:'';
  if(e.imdb) p.push(`<span class="pill">IMDb <b>${esc(e.imdb)}</b></span>`);

  if(e.tvm)  p.push(`<span class="pill">TVmaze <b>${esc((+e.tvm).toFixed(1))}</b></span>`);
  return p.length ? `<div class="ext">${p.join('')}</div>` : '';
}

/* ================= TVmaze (Serien: Poster und Wertung) ================= */
const Tvm = {
  cache:{},
  map(sh){ return { imdbID: sh.externals?.imdb || '', tvmId: sh.id, Title: sh.name, Year: (sh.premiered||'').slice(0,4), kind:'series',
    Poster: sh.image?.medium || null, PosterL: sh.image?.original || sh.image?.medium || null, tvm: sh.rating?.average || null,
    platform: (sh.webChannel||sh.network)?.name || null, weight: sh.weight||0, genres: sh.genres||[] }; },
  async search(q){
    try{ const r = await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q)).then(r=>r.json());
      return r.filter(x=>x.show && x.score>0.3).map(x=>({...Tvm.map(x.show), score:x.score})).slice(0,8); }catch(e){ return []; }
  },
  async lookup({imdb, id}){
    const key = imdb || 'id'+id; if(key in Tvm.cache) return Tvm.cache[key];
    try{ const r = await fetch(imdb ? 'https://api.tvmaze.com/lookup/shows?imdb='+imdb : 'https://api.tvmaze.com/shows/'+id);
      if(!r.ok) throw 0; return Tvm.cache[key] = Tvm.map(await r.json()); }catch(e){ return Tvm.cache[key] = null; }
  }
};

/* ================= Filmsuche: Wikidata (Teilwörter, deutsche Titel) + OMDb ================= */
const Finder = {
  cache:{},
  norm: s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(),
  qcache: new Map(),
  match(title, q){
    const nq=Finder.norm(q), qw=nq.split(' ').filter(w=>!/^\d{1,2}$/.test(w)); let m=0; const t0=Finder.norm(title);
    if(!t0) return 0;
    for(const t of [t0, t0.replace(/^(the|a|an|der|die|das|le|la|les|il|el) /,'')]){
      if(t===nq) m=Math.max(m,4); else if(t.startsWith(nq)) m=Math.max(m,3);
      else if(qw.length && qw.every(w=>t.split(' ').some(x=>x.startsWith(w)))) m=Math.max(m,2); else if(t.includes(nq)) m=Math.max(m,1); }
    return m;
  },
  async wikidata(q, signal){
    const W='https://www.wikidata.org/w/api.php?format=json&origin=*';
    const tw = Finder.norm(q).split(' ').filter(w=>w && !/^\d{1,2}$/.test(w));
    if(!tw.length) return [];
    const sr = tw.map(w=>w+'*').join(' ')+' haswbstatement:P345';
    const j = u => fetch(u,{signal}).then(r=>r.json());
    // 1. Kandidaten suchen (drei schnelle, kleine Abfragen parallel)
    const cq = encodeURIComponent(sr+' haswbstatement:P31=Q11424');
    const [s, sp2, sde, sen] = await Promise.all([
      j(`${W}&action=query&list=search&srlimit=25&srprop=&srsearch=${cq}`),
      j(`${W}&action=query&list=search&srlimit=15&srprop=&srsort=incoming_links_desc&srsearch=${cq}`),
      j(`${W}&action=wbsearchentities&type=item&limit=30&language=de&uselang=de&search=${encodeURIComponent(q)}`),
      j(`${W}&action=wbsearchentities&type=item&limit=30&language=en&uselang=en&search=${encodeURIComponent(q)}`)
    ]);
    const lbl={}; [...(sde.search||[]),...(sen.search||[])].forEach(x=>{ lbl[x.id] ||= x.label; });
    const ids = [...new Set([...(s.query?.search||[]).map(x=>x.title), ...(sp2.query?.search||[]).map(x=>x.title), ...Object.keys(lbl)])].slice(0,80);
    if(!ids.length) return [];
    // 2. Nur die benötigten Angaben gezielt abfragen (statt aller Daten jedes Treffers)
    const sp = `SELECT ?i ?imdb ?t ?y ?de ?en ?mul ?sl WHERE { VALUES ?i { ${ids.map(i=>'wd:'+i).join(' ')} }
      ?i wdt:P345 ?imdb . FILTER(STRSTARTS(?imdb,"tt")) ?i wdt:P31 ?t .
      OPTIONAL{ ?i wdt:P577 ?d . BIND(YEAR(?d) AS ?y) } OPTIONAL{ ?i rdfs:label ?de FILTER(LANG(?de)="de") }
      OPTIONAL{ ?i rdfs:label ?en FILTER(LANG(?en)="en") }
      OPTIONAL{ ?i rdfs:label ?mul FILTER(LANG(?mul)="mul") } OPTIONAL{ ?i wikibase:sitelinks ?sl } }`;
    const rows = (await j('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(sp))).results?.bindings || [];
    const OK = new Set(['Q11424','Q202866','Q24869','Q506240','Q5398426','Q581714','Q1259759','Q93204','Q226730','Q17517379','Q117467246','Q63952888']);
    const SER = new Set(['Q5398426','Q581714','Q1259759','Q117467246','Q63952888']);
    const by = {};
    rows.forEach(r=>{ const id=r.i.value.split('/').pop(), t=r.t?.value.split('/').pop();
      const x = by[id] ||= {id, imdb:r.imdb.value, types:new Set(), year:null, de:null, en:null, sl:0};
      if(t) x.types.add(t); if(r.y) x.year = x.year ? Math.min(x.year, +r.y.value) : +r.y.value;
      x.de ||= r.de?.value; x.en ||= r.en?.value || r.mul?.value; x.sl = Math.max(x.sl, +(r.sl?.value||0)); });
    return Object.values(by).filter(x=>[...x.types].some(t=>OK.has(t))).map(x=>{
      const title = x.de || x.en || lbl[x.id];
      const m = Math.max(Finder.match(x.de,q), Finder.match(x.en||lbl[x.id],q));
      return {imdbID:x.imdb, Title:title, Year:x.year?String(x.year):'', Poster:null,
        kind:[...x.types].some(t=>SER.has(t))?'series':'movie', score:m*40+Math.min(x.sl,120), m};
    }).filter(r=>r.m>0).sort((a,b)=>b.score-a.score);
  },
  merge(q, wd, om, tv){
    tv.forEach(r=>{ r.m=Finder.match(r.Title,q); r.score=r.m*40+Math.min(120,(r.weight||0)*1.25); });
    const strong=[...wd.filter(r=>r.m>=3), ...tv.filter(r=>r.m>=3)].sort((a,b)=>(b.score+(b.m>3?40:0))-(a.score+(a.m>3?40:0)));
    const out=[], seen=new Set();
    const add=r=>{ const k=r.imdbID||('tvm'+r.tvmId); if(k && !seen.has(k)){ seen.add(k); out.push({...r}); }
      else if(r.tvmId){ const o=out.find(x=>x.imdbID===r.imdbID); if(o){ o.Poster=o.Poster||r.Poster; o.PosterL=r.PosterL; o.tvmId=r.tvmId; o.tvm=r.tvm; o.kind='series'; } } };
    strong.forEach(add);
    om.forEach(r=>add({imdbID:r.imdbID,Title:r.Title,Year:r.Year,Poster:r.Poster!=='N/A'?r.Poster:null,kind:r.Type==='series'?'series':'movie'}));
    wd.forEach(add); tv.forEach(add);
    return out.slice(0,12);
  },
  // Liefert schnelle Treffer sofort über onPartial, die vollständige Liste als Rückgabewert
  async search(q, onPartial, signal){
    const key = Finder.norm(q);
    if(Finder.qcache.has(key)) return Finder.qcache.get(key);
    const pWd = Finder.wikidata(q, signal).catch(()=>null);
    const pOm = Omdb.on() ? Omdb.search(q).catch(()=>[]) : Promise.resolve([]);
    const pTv = Tvm.search(q);
    const [om, tv] = await Promise.all([pOm, pTv]);
    if(onPartial && !signal?.aborted) onPartial(Finder.merge(q, [], om, tv));
    // Wikidata höchstens 3 s abwarten, sonst bleiben die schnellen Treffer stehen
    const wd = await Promise.race([pWd, new Promise(r=>setTimeout(()=>r(null),3000))]);
    const res = Finder.merge(q, wd||[], om, tv);
    if(wd) Finder.qcache.set(key, res);
    return res;
  },
  async poster(id){
    if(id in Finder.cache) return Finder.cache[id];
    try{ const d=await Omdb.details(id); Finder.cache[id]=d.poster; return d.poster; }catch(e){ return Finder.cache[id]=null; }
  }
};

/* ================= OMDb (Poster + externe Ratings) ================= */
const Omdb = {
  on: () => !!CONFIG.OMDB_KEY,
  limitUntil: 0,
  // Antworten auf dem Gerät zwischenspeichern, damit das Tageslimit von OMDb reicht
  async get(params, days){
    const key = 'omdb:'+params;
    try{ const c = JSON.parse(localStorage.getItem(key)||'null'); if(c && Date.now()-c.t < days*864e5) return c.d; }catch(e){}
    if(Date.now() < Omdb.limitUntil) throw new Error('OMDb-Tageslimit erreicht');
    const d = await fetch(`https://www.omdbapi.com/?apikey=${CONFIG.OMDB_KEY}&${params}`).then(r=>r.json());
    if(d.Response==='False' && /limit/i.test(d.Error||'')){ Omdb.limitUntil = Date.now()+30*6e4; throw new Error('OMDb-Tageslimit erreicht'); }
    try{ localStorage.setItem(key, JSON.stringify({t:Date.now(), d})); }catch(e){}
    return d;
  },
  async search(q){
    const d = await Omdb.get('s='+encodeURIComponent(q.trim().toLowerCase()), 2);
    return (d.Search || []).filter(x=>x.Type==='movie'||x.Type==='series');
  },
  async details(id){
    const d = await Omdb.get('i='+id, 7); if(d.Response==='False') throw new Error(d.Error);
    const find = s => (d.Ratings||[]).find(x=>x.Source===s)?.Value;
    return {
      imdb_id:d.imdbID, title:d.Title, year:parseInt(d.Year)||null,
      poster: d.Poster!=='N/A'?d.Poster:null,
      ext:{ kind: d.Type==='series'?'series':'movie', seasons: d.totalSeasons&&d.totalSeasons!=='N/A'?d.totalSeasons:null, imdb: d.imdbRating!=='N/A'?d.imdbRating:null, rt: find('Rotten Tomatoes')||null,
            mc: find('Metacritic')?.replace('/100','')||null, genre:d.Genre, director:d.Director, runtime:d.Runtime }
    };
  }
};

async function refresh(){
  try{ const [r,f,dev,w] = await Promise.all([DB.list(), DB.friendships().catch(()=>[]), state.isDev==null ? DB.isDev().catch(()=>false) : state.isDev, DB.watchList().catch(()=>state.watch||[])]); state.ratings=r; state.fr=f; state.isDev=dev; state.watch=w;
    state.friendIds = new Set(f.filter(x=>x.status==='accepted').map(x=>x.other?.id)); }
  catch(e){ toast('Laden fehlgeschlagen: '+e.message); }
  render(); updateBadge(); setTimeout(healPosters, 1500); syncPush();
}
const isFriend = r => state.friendIds?.has(r.user_id);
let healing = false;
async function healPosters(){
  if(healing || DB.mode!=='online') return; healing = true;
  const todo = state.ratings.filter(r=>r.user_id===state.user.id && !r.poster && (r.imdb_id || r.ext?.kind==='series')).slice(0,6);
  let changed = false;
  for(const r of todo){
    try{
      let poster=null, ext=r.ext||{};
      if(ext.kind==='series'){ const t=await Tvm.lookup(r.imdb_id?{imdb:r.imdb_id}:{id:0}); if(t){ poster=t.PosterL||t.Poster; ext={...ext, tvm:ext.tvm??t.tvm, platform:ext.platform||t.platform}; } }
      if(!poster && r.imdb_id && Omdb.on()){ const x=await Omdb.details(r.imdb_id); poster=x.poster; ext={...x.ext, ...ext, imdb:ext.imdb||x.ext.imdb, rt:ext.rt||x.ext.rt, mc:ext.mc||x.ext.mc}; }
      if(poster){ await DB.save({...r, poster, ext}); r.poster=poster; r.ext=ext; changed=true; }
    }catch(e){ if(/limit/i.test(e.message)) break; }
  }
  healing = false;
  if(changed){ state.neuSig=null; render(); }
}
const isMeOrFriend = r => r.user_id===state.user.id || isFriend(r);
function updateBadge(){ const n=(state.fr||[]).filter(f=>f.incoming&&f.status==='pending').length; document.querySelectorAll('.prof').forEach(a=>a.classList.toggle('badge-dot', n>0)); }

function aggregate(rows){
  const m={};
  rows.forEach(r=>{ const k=filmKey(r); (m[k] ||= {key:k,title:r.title,year:r.year,poster:r.poster,ext:r.ext,list:[]}).list.push(r); if(!m[k].poster&&r.poster) m[k].poster=r.poster; if(!m[k].ext&&r.ext) m[k].ext=r.ext; });
  return Object.values(m).map(f=>({...f,overall:Math.round(f.list.reduce((a,r)=>a+avg(r),0)/f.list.length*10)/10,count:f.list.length,created_at:f.list[0].created_at}));
}

  lens.style.transform = `translate3d(${x}px,0,0)${big?' scale(1.2,1.28)':''}`;
}
function setupDock(tb){
  let drag=false, cur=null, raf=0, lastX=0, rect=null, liveT=0;
  const TS=[...tb.querySelectorAll('.tab')];
  const tabs=()=>TS;
  const at=cx=>{ const r=rect||tb.getBoundingClientRect(), ts=TS, w=lensW||ts[0].offsetWidth;
    let x=Math.max(4, Math.min(r.width-w-4, cx-r.left-w/2));
    const i=Math.max(0, Math.min(ts.length-1, Math.floor((cx-r.left-4)/((r.width-8)/ts.length))));
    return {x, t:ts[i]}; };
  const hover=t=>{ if(cur!==t){ cur=t; tick(); tabs().forEach(b=>b.classList.toggle('hover', b===t)); } };
  tb.addEventListener('pointerdown',e=>{ drag=true; cur=null; lastX=e.clientX; rect=tb.getBoundingClientRect(); try{ tb.setPointerCapture(e.pointerId); }catch(_){}
    const p=at(e.clientX); tb.classList.add('drag'); placeLens(p.x,true); hover(p.t);
    clearTimeout(liveT); liveT=setTimeout(()=>{ if(drag) tb.classList.add('live'); },170); });
  tb.addEventListener('pointermove',e=>{ if(!drag) return; lastX=e.clientX;
    if(!raf) raf=requestAnimationFrame(()=>{ raf=0; const p=at(lastX); placeLens(p.x,true); hover(p.t); }); },{passive:true});
  const end=e=>{ if(!drag) return; drag=false; clearTimeout(liveT); if(raf){ cancelAnimationFrame(raf); raf=0; } tb.classList.remove('drag','live'); tabs().forEach(b=>b.classList.remove('hover'));
    const cx=(e && e.clientX!=null && !isNaN(e.clientX) && e.clientX!==0) ? e.clientX : (e?.changedTouches?.[0]?.clientX ?? lastX);
    const id=at(cx).t.dataset.t;
    if(state.tab!==id){ (state.scroll ||= {})[state.tab]=window.scrollY; state.tab=id; render(); window.scrollTo({top: id==='neu' ? (state.scroll.neu||0) : 0}); } else { placeLens(); window.scrollTo({top:0,behavior:'smooth'}); } };
  tb.addEventListener('pointerup',end);
  tb.addEventListener('lostpointercapture',end);
  tb.addEventListener('touchend',end,{passive:true});
  // Sicherheitsnetz: falls ein Ende-Ereignis verloren geht, Linse nach kurzer Zeit zurücksetzen
  document.addEventListener('pointerup',()=>{ if(drag) end({clientX:lastX}); },true);
  tb.addEventListener('pointercancel',()=>{ drag=false; tb.classList.remove('drag','live'); tabs().forEach(b=>b.classList.remove('hover')); placeLens(); });
}

/* ================= Neu (Startseite im Netflix-Stil) ================= */
const KINO_URL = 'https://raw.githubusercontent.com/liasoer/filmrating/main/kino.json';
const GENRE_DE = {Action:'Action',Comedy:'Komödie',Drama:'Drama',Horror:'Horror',Thriller:'Thriller',Animation:'Animation',Family:'Familie',Fantasy:'Fantasy','Science-Fiction':'Science-Fiction','Science Fiction':'Science-Fiction',Romance:'Romantik',Documentary:'Dokumentarfilm',Adventure:'Abenteuer',Crime:'Krimi',Mystery:'Mystery',Supernatural:'Übernatürlich',Anime:'Anime',Medical:'Medizin',Legal:'Justiz',Espionage:'Spionage',History:'Geschichte',Sports:'Sport',Music:'Musik',Children:'Kinder',Biopic:'Biografie',Musical:'Musik',Western:'Western',War:'Krieg'};
const FMT_ROWS = [['IMAX','In IMAX'],['4DX','In 4DX'],['D-BOX','Mit D-BOX Sitzen'],['Dolby Atmos','In Dolby Atmos'],['ScreenX','In ScreenX'],['3D','In 3D'],['VIP & Premium','VIP & Premium'],['Kinderkino','Kinderkino']];
async function loadKino(){
  if(state.kino) return state.kino;
  try{ const r = await fetch(KINO_URL+'?h='+new Date().toISOString().slice(0,13)); if(!r.ok) throw 0; const k = await r.json();
    k.all = [...(k.now||[]).map(m=>({...m,_soon:false})), ...(k.soon||[]).map(m=>({...m,_soon:true}))];
    state.kino = k; }
  catch(e){ state.kino = {now:[], soon:[], all:[], err:true}; }
  return state.kino;
}
const FMT_SHOW = ['IMAX','4DX','D-BOX','Dolby Atmos','ScreenX','3D'];
function fmtsOf(r){
  let f = r?.ext?.formats;
  if(!f && r?.imdb_id && state.kino?.all){ f = state.kino.all.find(m=>m.imdb_id===r.imdb_id)?.formats; }
  return (f||[]).filter(x=>FMT_SHOW.includes(x));

const imdbNum = m => parseFloat(m.ext?.imdb)||0;
const genresDe = m => (m.genres||[]).map(g=>GENRE_DE[g]||g);
function badgeFor(m){ const f=(m.formats||[]).find(x=>x==='IMAX'||x==='4DX'||x==='ScreenX'); return f?`<span class="badge">${f}</span>`:''; }

function pcard(m){

function renderNeu(){
  const root = $('#neu'); const k = state.kino;
  const NK = state.neuKind||'movie'; const sd = state.series;
  const sig = [NK, sd?.updated, sd?.err, k?.updated, k?.err, state.ratings.length, state.ratings.reduce((a,r)=>a+(+r.overall||0),0), state.friendIds?.size, state.user?.username, (state.watch||[]).map(w=>w.key).join(',')].join('|');
  if(root.innerHTML && state.neuSig===sig) return;
  const head = `<div class="hdr"><h1 class="large">Neu</h1><button class="glass glass-btn avatar prof">${esc((state.user.username||'?')[0].toUpperCase())}</button></div>
    <div class="seg" id="neukind" style="margin-bottom:14px"><i class="seg-ind" style="transform:translateX(${NK==='series'?'100%':'0'})"></i><button data-k="movie" class="${NK==='movie'?'on':''}">Filme</button><button data-k="series" class="${NK==='series'?'on':''}">Serien</button></div>
    ${watchRow(NK)}`;
  const bindHead = () => { root.querySelector('.prof').onclick=openProfile;
    root.querySelectorAll('#neukind button').forEach(b=>b.onclick=()=>{ if((state.neuKind||'movie')!==b.dataset.k){ state.neuKind=b.dataset.k; tick();
      root.querySelector('#neukind .seg-ind').style.transform=`translateX(${b.dataset.k==='series'?'100%':'0'})`; setTimeout(()=>{ render(); window.scrollTo({top:0}); },180); } }); };
  if(NK==='series'){
    if(!sd) loadSeries().then(()=>{ if(state.tab==='neu') render(); });
    root.innerHTML = head + installBanner() + seriesBody();
    bindHead(); bindBanner(); updateBadge(); bindSeries(root); bindWatch(root); state.neuSig = sig; return;
  }
  if(!k) loadKino().then(()=>{ if(state.tab==='neu') render(); });
  if(!k || k.err){
    root.innerHTML = head + `<div class="empty">${!k?'Lade Kinoprogramm…':I.pop+'Das Kinoprogramm konnte nicht geladen werden.'}</div>`;
    bindHead(); bindWatch(root); return;
  }
  const all = k.all.map((m,i)=>({...m,_i:i}));
  const now = all.filter(m=>!m._soon), soon = all.filter(m=>m._soon);
  const days = m => m.release ? (Date.now()-new Date(m.release))/864e5 : 999;
  let heroes = now.filter(m=>m.isNew || days(m)<=21).sort((a,b)=>(a.order||99)-(b.order||99)).slice(0,6);
  if(heroes.length<4) heroes = [...heroes, ...now.filter(m=>!heroes.includes(m)).slice(0,4-heroes.length)];
  const rated = all.filter(m=>friendsFor(m).length);
  const genres = {}; now.forEach(m=>genresDe(m).forEach(g=>(genres[g] ||= []).push(m)));
  const genreList = Object.entries(genres).sort((a,b)=>b[1].length-a[1].length);

/* ================= Push-Mitteilungen ================= */
const PUSH_FN = 'https://vpdgwopcsevtvvaufegr.supabase.co/functions/v1/push';
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64u = s => { const p='='.repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b,c=>c.charCodeAt(0)); };
async function pushState(){
  if(!pushSupported()) return 'unsupported';
  if(Notification.permission==='denied') return 'denied';
  try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=await reg?.pushManager.getSubscription(); return sub?'on':'off'; }catch(e){ return 'off'; }
}
async function enablePush(){
  if(platform()==='ios' && !isStandalone()){ toast('Installiere die App zuerst auf dem Home-Bildschirm'); openInstall(); return false; }
  if(!pushSupported()){ toast('Dieses Gerät unterstützt keine Mitteilungen'); return false; }
  const perm = await Notification.requestPermission();
  if(perm!=='granted'){ toast('Mitteilungen wurden nicht erlaubt'); return false; }
  const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  const {publicKey} = await fetch(PUSH_FN+'?action=key').then(r=>r.json());
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(publicKey)});
  await DB.savePush(sub);
  toast('Mitteilungen sind aktiv'); return true;
}
async function disablePush(){
  try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=await reg?.pushManager.getSubscription();
    if(sub){ await DB.removePush(sub.endpoint); await sub.unsubscribe(); } }catch(e){}
  toast('Mitteilungen ausgeschaltet');
}
// Bestehendes Abo bei jedem Start mit dem angemeldeten Konto verknüpfen
async function syncPush(){ try{ const reg=await navigator.serviceWorker?.getRegistration(); const sub=await reg?.pushManager?.getSubscription(); if(sub) await DB.savePush(sub); }catch(e){} }
navigator.serviceWorker?.addEventListener('message', e => { if(e.data?.type==='open-profile' && state.user){ refresh().then(openProfile); } });
if(/[?&]profil/.test(location.search)) setTimeout(()=>{ if(state.user) openProfile(); }, 1500);

// Einmaliges Popup nach dem Start: fragt nach Mitteilungen, bevor iOS selbst fragt (iOS zeigt seine Abfrage nur nach einem Antippen)
async function maybePushPrompt(){
  try{
    if(DB.mode!=='online' || !state.user || !isStandalone() || !pushSupported()) return;
    if(await pushState()!=='off') return;
    let p={}; try{ p=JSON.parse(localStorage.getItem('fr-push-ask')||'{}'); }catch(e){}
    if((p.n||0)>=2 || (p.t && Date.now()-p.t < 3*864e5)) return;
    if($('#sheet').classList.contains('open')) return;
    try{ localStorage.setItem('fr-push-ask', JSON.stringify({n:(p.n||0)+1, t:Date.now()})); }catch(e){}
    openSheet({ body:`

        <div class="hint" style="text-align:center;margin-top:8px;font-size:16px;line-height:1.4">Erfahre sofort, wenn dir jemand eine Freundschaftsanfrage schickt oder deine annimmt.</div>
      </div>

      <button class="btn sec2" id="pa-no">Später</button>` });

  }catch(e){}

  const all = Math.round(list.reduce((a,r)=>a+avg(r),0)/list.length*10)/10;
  openSheet({ body:`
    <div class="hero">
      <div class="hero-bg" ${posterStyle(f.poster)}></div>
      <div class="hero-in">
        <div class="poster" ${posterStyle(f.poster)}>${f.poster?'':I.film}</div>
        <h2>${esc(f.title)}</h2>
        <div class="meta">${[e?.kind==='series'?'Serie'+(e.seasons?` · ${e.seasons} Staffel${e.seasons>1?'n':''}`:''):'', f.year,e?.genre,e?.kind==='series'?'':e?.runtime].filter(Boolean).map(esc).join(' · ')}</div>
        ${e?.director?`<div class="meta">Regie: ${esc(e.director)}</div>`:''}
        <div class="scorerow">${ring(all,'xl')}<div class="lbl"><b>Schnitt aller Nutzer</b>${list.length} Bewertung${list.length>1?'en':''}</div></div>
        ${extPills(e, fmtsOf(list.find(x=>x.ext)||f))}
      </div>
    </div>
    ${mine?`
      <div class="sec">Deine Bewertung</div>
      <div class="grp"><div class="cell"><div class="cell-h"><b>${fmtDate(mine.watched_on)||'Gesehen'}</b>${ring(avg(mine),'sm')}</div>${bars(mine)}${mine.note?`<div class="note">${esc(mine.note)}</div>`:''}</div></div>
      <button class="btn sec2" id="ed">Bewertung bearbeiten</button>`
     :`<button class="btn pri" id="rate" style="margin-top:22px">Diesen Film bewerten</button>`}
    ${others.length?`<div class="sec">Freunde</div><div class="grp">`+others.map(r=>`
      <div class="cell"><div class="cell-h"><b>${esc(r.username||'Unbekannt')}</b>${ring(avg(r),'sm')}</div>${bars(r)}${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div>`).join('')+`</div>`:''}
  `});
  if(mine) $('#ed').onclick=()=>openForm(mine);
  else $('#rate').onclick=()=>openForm({title:f.title,year:f.year,poster:f.poster,imdb_id:f.imdb_id,ext:e});
}

function openForm(r){
  const isEdit = !!r?.id;
  const d = r ? {...r} : {watched_on:new Date().toISOString().slice(0,10)};
  CRITERIA.forEach(c=>{ if(d[c.key]==null) d[c.key]=7; });
  const S = () => ['film', ...critFor(d).map(c=>c.key), 'done'];
  let i = d.title ? 1 : 0, dir = 1;

  openSheet({ swipe:false, title:`<div class="prog" id="prog"></div>`, body:`<div id="wz"></div>`, footer:`<button class="btn pri" id="nx" style="margin:0">Weiter</button>` });
  $('#sheet').classList.add('wiz'); $('#sheet').insertAdjacentHTML('afterbegin','<div class="wz-bg" id="wzbg"></div>');
  const go = n => { dir = n>i?1:-1; i = n; tick(); draw(); };

  function draw(){
    const st = S()[i];
    $('#prog').innerHTML = S().map((s,k)=>`<i class="${k<i?'d':k===i?'on':''}"></i>`).join('');
    const x = $('#shx');
    if(i===0 || (i===1 && r?.title)){ x.innerHTML = I.close; x.onclick = closeSheet; }
    else { x.innerHTML = I.back; x.onclick = ()=>go(i-1); }
    const nx = $('#nx'), foot = $('#shf');
    foot.style.display = st==='film' ? 'none' : '';
    const wz = $('#wz');
    wz.className = 'wz '+(dir>0?'in-r':'in-l');
    void wz.offsetWidth;

    if(st==='film'){
      wz.innerHTML = `<h2 class="wz-h">${r ? 'Was hast du gesehen?' : 'Film oder Serie suchen'}</h2>
        <label class="search" style="margin-top:18px">${I.search}<input id="fs" type="search" placeholder="Film oder Serie suchen" enterkeyhint="search" autocomplete="off" autocorrect="off"></label>
        <div class="grp" id="sr" style="margin-top:12px;display:none"></div>
        <div style="text-align:center;margin-top:18px"><button class="link" id="man">Manuell eintragen</button></div>`;
      setTimeout(()=>$('#fs')?.focus(), 350);
      let t, seq=0, ctrl=null;
      $('#fs').oninput=e=>{ clearTimeout(t); const q=e.target.value.trim(); const sr=$('#sr'); if(q.length<2){ sr.style.display='none'; sr.innerHTML=''; return; }
        t=setTimeout(async()=>{ const my=++seq; sr.style.display=''; if(!sr.querySelector('.res')) sr.innerHTML='<div class="hint" style="padding:14px 0">Suche…</div>';
          ctrl?.abort(); ctrl=new AbortController();
          try{ const res=await Finder.search(q, part=>{ if(my===seq && part.length) show(part, false); }, ctrl.signal); if(my!==seq) return; show(res, true); }
          catch(err){ if(my===seq && err.name!=='AbortError') sr.innerHTML='<div class="hint" style="padding:14px 0">Suche fehlgeschlagen.</div>'; }
        },220); };
      const show=(res, final)=>{ const sr=$('#sr'); if(!sr) return;
            sr.innerHTML = res.length ? res.map(m=>`<button class="res" data-id="${m.imdbID}" data-t="${esc(m.Title)}" data-y="${esc(m.Year||'')}" data-kind="${m.kind||'movie'}" data-tvm="${m.tvmId||''}"><div class="poster" data-p="${m.imdbID}" ${posterStyle(m.Poster)}>${m.Poster?'':I.film}</div><div class="info"><div class="title">${esc(m.Title)}</div><div class="meta">${[m.kind==='series'?'Serie':'Film', m.Year].filter(Boolean).map(esc).join(' · ')}</div></div></button>`).join('') : `<div class="hint" style="padding:14px 0">Nichts gefunden.</div>`;
            document.querySelectorAll('.res').forEach(b=>b.onclick=async()=>{
              document.activeElement?.blur();
              d.title=b.dataset.t; d.year=parseInt(b.dataset.y)||null; d.imdb_id=/^tt/.test(b.dataset.id)?b.dataset.id:null; d.ext={...(d.ext||{}), kind:b.dataset.kind||'movie'};
              const p=b.querySelector('.poster').style.backgroundImage.match(/url\(["']?(.*?)["']?\)/); d.poster=p?p[1]:null;
              if(Omdb.on() && d.imdb_id){ try{ const x=await Omdb.details(d.imdb_id); d.ext={...x.ext, formats:d.ext?.formats}; d.poster=x.poster||d.poster; d.year=x.year||d.year; }catch(e){} }
              if(d.ext?.kind==='series' || b.dataset.tvm){ const t=await Tvm.lookup(d.imdb_id?{imdb:d.imdb_id}:{id:b.dataset.tvm});
                if(t){ d.poster=t.PosterL||d.poster; d.ext={...(d.ext||{}), kind:'series', tvm:t.tvm, platform:t.platform}; d.year=d.year||parseInt(t.Year)||null; if(!d.imdb_id && t.imdbID) d.imdb_id=t.imdbID; } }
              const dup=state.ratings.find(x=>x.user_id===state.user.id&&filmKey(x)===filmKey(d));
              if(dup && !isEdit){ Object.assign(d, {...dup, poster:d.poster||dup.poster, ext:d.ext||dup.ext}); toast('Du hast diesen Film schon bewertet, du bearbeitest ihn jetzt'); return go(1); }
              if(r) return go(1);
              choose();
            });
            if(Omdb.on()) res.filter(m=>!m.Poster).slice(0,8).forEach(async m=>{ const p = m.kind==='series' ? (await Tvm.lookup({imdb:m.imdbID}))?.Poster || await Finder.poster(m.imdbID) : await Finder.poster(m.imdbID); const el=document.querySelector(`[data-p="${m.imdbID}"]`); if(p&&el){ el.style.backgroundImage=`url('${p}')`; el.innerHTML=''; } });
      };
      const choose=()=>{
        const e=d.ext||{}, on=inWatch(d);
        wz.innerHTML = `<div class="pick">
            <div class="poster" ${posterStyle(d.poster)}>${d.poster?'':I.film}</div>
            <h2 class="wz-h" style="margin-top:16px">${esc(d.title)}</h2>
            <div class="hint" style="text-align:center;margin-top:4px">${[e.kind==='series'?'Serie':'Film', d.year, e.genre].filter(x=>x&&x!=='N/A').map(esc).join(' · ')}</div>
            ${extPills(e)}
          </div>
          <button class="btn pri" id="cr" style="margin-top:24px">Jetzt bewerten</button>
          ${watchBtn('cw')}
          <div style="text-align:center;margin-top:14px"><button class="link" id="cb">Andere Suche</button></div>`;
        $('#cr').onclick=()=>go(1);
        const b=$('#cw'); setWatchBtn(b, on);
        b.onclick=async()=>{ await toggleWatch(d, b); if(!on) setTimeout(closeSheet, 450); };
        $('#cb').onclick=()=>draw();
      };
      $('#man').onclick=()=>{
        wz.innerHTML = `<h2 class="wz-h">Film eintragen</h2>
          <div class="grp" style="margin-top:18px"><div class="field"><label>Titel</label><input id="ft" placeholder="Filmtitel" value="${esc(d.title||'')}"></div><div class="field"><label>Jahr</label><input id="fy" inputmode="numeric" placeholder="2026" value="${esc(d.year||'')}"></div></div>
          <div class="seg" id="mk" style="margin-top:12px"><button data-k="movie" class="${(d.ext?.kind||'movie')==='movie'?'on':''}">Film</button><button data-k="series" class="${d.ext?.kind==='series'?'on':''}">Serie</button></div>`;
        let mk=d.ext?.kind||'movie'; document.querySelectorAll('#mk button').forEach(b=>b.onclick=()=>{ mk=b.dataset.k; document.querySelectorAll('#mk button').forEach(x=>x.classList.toggle('on',x===b)); tick(); });
        foot.style.display=''; nx.textContent='Weiter';
        nx.onclick=()=>{ d.title=$('#ft').value.trim(); d.year=parseInt($('#fy').value)||null; if(!d.title) return toast('Bitte einen Titel eingeben'); d.imdb_id=null; d.poster=null; d.ext={kind:mk}; go(1); };
        setTimeout(()=>$('#ft').focus(),50);
      };
      return;
    }

    const bg=$('#wzbg'); if(bg) bg.style.backgroundImage = d.poster?`url('${d.poster}')`:'';
    const fm = fmtsOf(d);
    const filmHead = `<div class="wz-film"><div class="poster" ${posterStyle(d.poster)}>${d.poster?'':I.film}</div><div class="info"><div class="title">${esc(d.title)}</div><div class="meta">${esc(d.year||'')}</div>${fm.length?`<div class="ext">${fm.map(f=>`<span class="pill fmt">${esc(f)}</span>`).join('')}</div>`:''}</div></div>`;
    const WORD = v => v<3?'Schlecht':v<5?'Schwach':v<6.5?'Okay':v<8?'Gut':v<9.5?'Sehr gut':'Meisterwerk';

    if(st!=='done'){
      const C = critFor(d), c = C.find(c=>c.key===st), n = S().indexOf(st);
      wz.innerHTML = `${filmHead}
        <div class="wz-crit">
          <div class="wz-step">${n} von ${C.length}</div>
          <h2 class="wz-h">${c.label}</h2>
          <div class="hint" style="margin:6px 0 0;text-align:center">${c.hint||''}</div>
          <div class="meter" id="mt"><div class="meter-in"><div class="wz-val" id="wv">${f1(d[st])}</div><div class="wz-word" id="ww"></div></div></div>
          <div class="wz-ctl">
            <button class="glass glass-btn" id="mn" aria-label="Weniger">${I.minus}</button>
            <input type="range" min="1" max="10" step="0.5" id="rg" value="${d[st]}" aria-label="${c.label}">
            <button class="glass glass-btn" id="pl" aria-label="Mehr">${I.plus}</button>
          </div>
          <div class="ticks" style="padding:0 64px;width:100%"><span>1</span><span>10</span></div>
        </div>`;
      const rg=$('#rg'), wv=$('#wv'), mt=$('#mt'), ww=$('#ww');
      const set=v=>{ v=Math.min(10,Math.max(1,Math.round(v*2)/2)); if(v!==d[st]) tick(); d[st]=v; rg.value=v; wv.textContent=f1(v); ww.textContent=WORD(v); ww.style.color=col(v); mt.style.setProperty('--v',v*10); mt.style.setProperty('--c',col(v)); rg.style.setProperty('--p',((v-1)/9*100)+'%'); };
      rg.oninput=()=>set(+rg.value); $('#mn').onclick=()=>set(d[st]-0.5); $('#pl').onclick=()=>set(d[st]+0.5);
      set(d[st]);
      nx.textContent = 'Weiter'; nx.onclick=()=>go(i+1);
      return;
    }

    // Zusammenfassung
    wz.innerHTML = `${filmHead}
      <div class="meter sm" style="--v:${avg(d)*10};--c:${col(avg(d))};margin:26px auto 6px"><div class="meter-in"><div class="wz-val" style="color:var(--t1)">${f1(avg(d))}</div><div class="wz-word" style="color:${col(avg(d))}">${WORD(avg(d))}</div></div></div>
      <div class="hint" style="text-align:center;margin:0 0 4px">Deine Gesamtnote</div>
      <div class="grp" style="margin-top:16px">${critFor(d).map((c,k)=>`<button class="cell cell-h" data-go="${k+1}" style="width:100%;text-align:left"><span>${c.label}</span><span style="display:flex;align-items:center;gap:10px"><b style="color:${col(d[c.key])}">${f1(d[c.key])}</b><span style="color:var(--t3)">${I.chev}</span></span></button>`).join('')}</div>
      <div class="grp" style="margin-top:12px"><div class="field"><label for="fd">Gesehen am</label><input type="date" id="fd" value="${esc(d.watched_on||'')}"></div></div>
      <div class="sec">Notiz</div>
      <div class="grp"><textarea class="ta" id="fn" placeholder="Was ist dir aufgefallen? (optional)">${esc(d.note||'')}</textarea></div>
      ${d.id?'<button class="btn red" id="dl" style="margin-top:22px">Bewertung löschen</button>':''}`;
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
    $('#fd').onchange=e=>d.watched_on=e.target.value; $('#fn').oninput=e=>d.note=e.target.value;
    nx.textContent='Bewertung sichern';
    nx.onclick=async()=>{
      d.note=($('#fn').value||'').trim(); d.overall=avg(d);
      nx.disabled=true;
      try{ await DB.save(d); if(inWatch(d)){ await DB.watchRemove(filmKey(d)).catch(()=>{}); state.watch=state.watch.filter(w=>w.key!==filmKey(d)); } closeSheet(); toast('Gespeichert'); state.tab='mine'; await refresh(); }catch(e){ toast('Fehler: '+e.message); nx.disabled=false; }
    };
    if(d.id) $('#dl').onclick=async()=>{ try{ await DB.remove(d.id); closeSheet(); toast('Gelöscht'); await refresh(); }catch(e){ toast(e.message); } };
  }
  draw();
}

function openProfile(){
  const fr=state.fr||[];
  const mine=state.ratings.filter(r=>r.user_id===state.user.id);
  const a=mine.length?Math.round(mine.reduce((s,r)=>s+avg(r),0)/mine.length*10)/10:0;
  openSheet({ title:'Profil', body:`
    <div style="text-align:center;margin:10px 0 6px">
      <div class="glass glass-btn avatar" style="width:84px;height:84px;margin:0 auto;font-size:34px">${esc((state.user.username||'?')[0].toUpperCase())}</div>
      <h2 style="font:800 24px/1.2 var(--f);margin-top:14px">@${esc(state.user.username||'')}</h2>
      <div class="meta">${esc(state.user.email||'')}</div>
    </div>
    <div class="grp" style="margin-top:20px"><div class="cell cell-h"><span>Bewertungen</span><b>${mine.length}</b></div><div class="cell cell-h"><span>Dein Schnitt</span>${ring(a,'sm')}</div></div>
    <div class="sec">Mitteilungen</div>
    <div class="grp"><div class="cell cell-h"><span>Freundschaftsanfragen<div class="meta" style="margin-top:2px">Neue und angenommene Anfragen</div></span><button class="tgl" id="pushtgl" aria-label="Mitteilungen"><i></i></button></div></div>
    <div class="hint" id="pushhint"></div>
    <div class="sec">Freund hinzufügen</div>
    <div class="grp"><div class="field"><span style="color:var(--t3)">@</span><input id="fa" style="text-align:left;color:var(--t1)" placeholder="Nutzername" autocapitalize="off" autocorrect="off" autocomplete="off" enterkeyhint="send"><button class="link" id="fab2" style="padding:8px 0 8px 8px">Hinzufügen</button></div></div>
    ${fr.filter(f=>f.incoming&&f.status==='pending').length?`<div class="sec">Anfragen</div><div class="grp">${fr.filter(f=>f.incoming&&f.status==='pending').map(f=>`<div class="cell cell-h"><b>@${esc(f.other?.username)}</b><span style="display:flex;gap:14px"><button class="link" data-acc="${f.id}">Annehmen</button><button class="link" style="color:var(--t2)" data-del="${f.id}">Ablehnen</button></span></div>`).join('')}</div>`:''}
    <div class="sec">Deine Freunde (${fr.filter(f=>f.status==='accepted').length})</div>
    <div class="grp">${fr.filter(f=>f.status!=='pending'||!f.incoming).map(f=>`<div class="cell cell-h"><span ${f.status==='accepted'?`class="flink" data-fo="${esc(f.other?.id)}"`:''}><b>@${esc(f.other?.username)}</b>${f.status==='pending'?' <span class="meta" style="display:inline">· Anfrage gesendet</span>':' <span class="meta" style="display:inline">· '+esc(friendStats(f.other?.id).line.split(' · ').slice(0,2).join(', '))+'</span>'}</span><button class="link" style="color:var(--t2)" data-del="${f.id}">${f.status==='pending'?'Zurückziehen':'Entfernen'}</button></div>`).join('') || '<div class="cell note" style="margin:0">Noch keine Freunde. Füge sie oben über ihren Nutzernamen hinzu.</div>'}</div>
    <button class="btn sec2" id="inv" style="display:flex;align-items:center;justify-content:center;gap:8px">${I.share}App mit Freunden teilen</button>
    <div class="hint">Freunde sehen deine Bewertungen erst, wenn ihr euch gegenseitig bestätigt habt. Im Tab «Top» fliessen alle Bewertungen anonym in den Schnitt ein.</div>
    <div class="sec">Dein Nutzername</div>
    <div class="grp"><div class="field"><span style="color:var(--t3)">@</span><input id="pn" style="text-align:left;color:var(--t1)" value="${esc(state.user.username||'')}" autocapitalize="off" autocorrect="off" autocomplete="username"></div></div>
    <button class="btn sec2" id="ps">Nutzername sichern</button>
    ${isStandalone()?'':`<div class="sec">App installieren</div>${installSteps()}`}
    ${state.isDev?`<div class="sec">Entwickler</div><button class="btn sec2" id="dev" style="margin-top:0;display:flex;align-items:center;justify-content:center;gap:8px">${I.code} Entwickler-Ansicht</button>`:''}
    <button class="btn red" id="lo" style="margin-top:24px">Abmelden</button>
    ${DB.mode==='demo'?'<div class="demo">Demo-Modus aktiv.</div>':''}
  `});
  $('#inv').onclick=invite; bindInstall();
  (async()=>{ const t=$('#pushtgl'), h=$('#pushhint'); if(!t) return; let st=await pushState();
    const show=()=>{ t.classList.toggle('on', st==='on'); t.disabled = st==='unsupported'||st==='denied';
      h.textContent = st==='denied' ? 'Mitteilungen sind blockiert. Erlaube sie in den Einstellungen deines Handys für Screenreview.'
        : st==='unsupported' ? (platform()==='ios' && !isStandalone() ? 'Auf dem iPhone funktionieren Mitteilungen nur, wenn die App auf dem Home-Bildschirm installiert ist.' : 'Dieses Gerät unterstützt keine Mitteilungen.') : ''; };
    show();
    t.onclick=async()=>{ t.disabled=true; try{ if(st==='on'){ await disablePush(); st='off'; } else { st = (await enablePush()) ? 'on' : await pushState(); } }catch(e){ toast(e.message); } t.disabled=false; show(); };
  })(); const dv=$('#dev'); if(dv) dv.onclick=openDev;
  const uname=v=>v.trim().replace(/^@/,'').toLowerCase();
  $('#ps').onclick=async()=>{ const n=uname($('#pn').value); if(!/^[a-z0-9._]{3,20}$/.test(n)) return toast('3 bis 20 Zeichen: a-z, 0-9, Punkt, Unterstrich');
    try{ await DB.setUsername(n); toast('Gespeichert'); closeSheet(); await refresh(); }catch(e){toast(e.message);} };
  const add=async()=>{ const n=uname($('#fa').value); if(!n) return;
    try{ const r=await DB.addFriend(n); toast(r==='accepted'?`Du und @${n} seid jetzt Freunde`:`Anfrage an @${n} gesendet`); await refresh(); openProfile(); }catch(e){ toast(e.message); } };
  $('#fab2').onclick=add; $('#fa').onkeydown=e=>{ if(e.key==='Enter') add(); };
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=async()=>{ try{ await DB.acceptFriend(b.dataset.acc); toast('Freundschaft bestätigt'); await refresh(); openProfile(); }catch(e){toast(e.message);} });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ try{ await DB.removeFriend(b.dataset.del); await refresh(); openProfile(); }catch(e){toast(e.message);} });
  document.querySelectorAll('[data-fo]').forEach(b=>b.onclick=()=>{ tick(); closeSheet(); setTimeout(()=>openFriend(b.dataset.fo),350); });
  $('#lo').onclick=async()=>{ await DB.signOut(); state.user=null; state.isDev=null; closeSheet(); renderAuth(); };
}

/* ================= Auto-Update ================= */
const APP_VERSION = '47';
async function checkUpdate(){
  try{
    const t = await fetch(location.pathname+'?nocache='+Date.now(), {cache:'no-store'}).then(r=>r.text());
    const v = (t.match(/APP_VERSION = '(\d+)'/)||[])[1];
    if(v && v!==APP_VERSION){ location.replace(location.pathname+'?v='+v); }
  }catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });

/* ================= Start ================= */
(async()=>{
  try{ await DB.init(); state.user = await DB.getUser(); }catch(e){ toast(e.message); }
  state.user ? refresh().then(()=>setTimeout(maybePushPrompt, 1500)) : renderAuth();
  loadKino().then(()=>{ if(state.user) render(); });
})();
</script>
