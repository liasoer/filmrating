<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Screenreview</title>
<meta name="description" content="Filme und Serien bewerten und mit Freunden vergleichen. Jetzt als iPhone-App.">
<link rel="icon" href="icon-192.png?v=4">
<link rel="apple-touch-icon" href="icon-512.png?v=4">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:40px 22px;box-sizing:border-box;text-align:center}
main{max-width:420px}
img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 40px rgba(10,132,255,.35)}
h1{font-size:34px;letter-spacing:-.6px;margin:20px 0 6px}
p{color:rgba(235,235,245,.62);margin:0 0 22px}
.grp{background:rgba(44,44,50,.55);border:.6px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;margin-bottom:22px}
.grp p{margin:0;font-size:15px}
a{color:#0a84ff;text-decoration:none}
.foot{font-size:13px}
</style></head><body><main>
<img src="icon-512.png?v=4" alt="">
<h1>Screenreview</h1>
<p>Filme und Serien bewerten und mit Freunden vergleichen.</p>
<div class="grp"><p>Die Web-App wurde eingestellt. Screenreview gibt es jetzt als App fürs iPhone. Dein Konto und alle Bewertungen sind dort weiterhin da, melde dich einfach mit denselben Daten an.</p></div>
<p class="foot"><a href="datenschutz.html">Datenschutz</a></p>
</main>
<script>
// Alte Web-App sauber entfernen: Service Worker abmelden, Zwischenspeicher leeren
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
</script>
</body></html>
