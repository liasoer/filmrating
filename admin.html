<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow">
<title>Admin · Screenreview</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:max(28px,env(safe-area-inset-top)) 16px 50px}
main{max-width:760px;margin:0 auto}
h1{font-size:30px;letter-spacing:-.5px;margin:0 0 4px}
h2{font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:rgba(235,235,245,.62);margin:26px 4px 8px;font-weight:600}
.t2{color:rgba(235,235,245,.62)} .t3{color:rgba(235,235,245,.32);font-size:13px}
.grp{background:rgba(44,44,50,.55);border:.6px solid rgba(255,255,255,.12);border-radius:22px;overflow:hidden}
.row{padding:14px 16px;border-top:.5px solid rgba(255,255,255,.1)} .row:first-child{border-top:0}
input{width:100%;height:50px;border:0;background:transparent;color:#fff;font:inherit;padding:0 16px;outline:none}
input+input{border-top:.5px solid rgba(255,255,255,.12)}
button{border:0;border-radius:20px;height:36px;padding:0 14px;font:600 14px/1 -apple-system,system-ui,sans-serif;cursor:pointer;background:rgba(118,118,128,.24);color:#fff}
button.p{background:#0a84ff;width:100%;height:50px;border-radius:25px;font-size:17px;margin-top:14px}
button.d{color:#ff453a} button.ok{color:#30d158}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(255,69,58,.2);color:#ff6961}
.pill.done{background:rgba(48,209,88,.16);color:#30d158}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 12px;text-align:left;border-top:.5px solid rgba(255,255,255,.1);white-space:nowrap}
th{color:rgba(235,235,245,.62);font-weight:600;border-top:0}
.scroll{overflow-x:auto}
.err{color:#ff453a;min-height:20px;margin-top:10px}
.hide{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:rgba(44,44,50,.55);border:.6px solid rgba(255,255,255,.12);border-radius:18px;padding:12px 14px}
.tile b{display:block;font-size:26px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:rgba(235,235,245,.62)}
.chart{padding:14px 14px 10px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;background:#0a84ff;min-height:2px}
.bar i:first-child{border-radius:4px 4px 0 0}
.bar i.s{background:#bf5af2}
.bar small{font-size:10px;text-align:center;color:rgba(235,235,245,.62);margin-bottom:3px;font-variant-numeric:tabular-nums}
.blab{display:flex;gap:4px;margin-top:5px;font-size:10px;color:rgba(235,235,245,.38)} .blab span{flex:1;text-align:center;min-width:0;overflow:hidden}
.legend{font-size:12px;color:rgba(235,235,245,.62);margin-top:8px} .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 5px 0 10px;vertical-align:0} .legend i:first-child{margin-left:0}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:.5px solid rgba(255,255,255,.1);font-size:14px} .hrow:first-child{border-top:0}
.hrow .l{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .b{flex:1;height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden} .hrow .b i{display:block;height:100%;background:#0a84ff;border-radius:5px}
.hrow .n{width:74px;flex:none;text-align:right;color:rgba(235,235,245,.62);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 16px}
blockquote{margin:8px 0 0;padding:8px 12px;border-left:3px solid rgba(255,255,255,.2);color:rgba(235,235,245,.8);background:rgba(255,255,255,.04);border-radius:6px;white-space:pre-wrap}
</style></head>
<body><main>
<div class="top"><div><h1>Admin</h1><div class="t2">Screenreview</div></div><button id="out" class="hide">Abmelden</button></div>

<section id="login">
<h2>Anmelden</h2>
<div class="grp"><input id="em" type="email" placeholder="E-Mail" autocomplete="username"><input id="pw" type="password" placeholder="Passwort" autocomplete="current-password"></div>
<button class="p" id="go">Anmelden</button>
<div class="err" id="lerr"></div>
</section>

<section id="app" class="hide">
<h2>Überblick</h2>
<div class="tiles" id="tiles"></div>
<div class="cols">
<div><h2>Letzte 14 Tage: Bewertungen</h2><div class="grp chart" id="days"></div></div>
<div><h2>Letzte 12 Wochen</h2><div class="grp chart" id="weeks"></div></div>
</div>
<div class="cols">
<div><h2>Wie Neue ankommen</h2><div class="grp" id="funnel"></div></div>
<div><h2>Notenverteilung</h2><div class="grp chart" id="scores"></div></div>
</div>
<div class="cols">
<div><h2>Meistbewertet</h2><div class="grp" id="toptitles"></div></div>
<div><h2>Genres</h2><div class="grp" id="genres"></div></div>
</div>
<div class="cols">
<div><h2>Wo geschaut</h2><div class="grp" id="where"></div></div>
<div><h2>Mitteilungen</h2><div class="grp" id="push"></div></div>
</div>
<p class="t3" id="gen"></p>
<h2 id="rh">Meldungen</h2>
<div id="reports"></div>
<p class="t3">Apple verlangt, dass Meldungen innert 24 Stunden geprüft werden.</p>
<h2 id="uh">Nutzer</h2>
<div class="grp scroll"><table id="users"></table></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient("https://vpdgwopcsevtvvaufegr.supabase.co", "sb_publishable_8igcj2eTIqMjcsjkAxum7A_jSyR96RY");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const day = s => s ? new Date(s).toLocaleString("de-CH", {dateStyle:"medium", timeStyle:"short"}) : "–";

async function show() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("login").classList.remove("hide"); $("app").classList.add("hide"); $("out").classList.add("hide"); return; }
  const { data: dev } = await sb.rpc("is_dev");
  if (dev !== true) { $("lerr").textContent = "Kein Zugriff mit diesem Konto."; await sb.auth.signOut(); return; }
  $("login").classList.add("hide"); $("app").classList.remove("hide"); $("out").classList.remove("hide");
  await Promise.all([loadReports(), loadStats()]);
}

async function loadReports() {
  const { data, error } = await sb.rpc("dev_reports");
  if (error) { $("reports").innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  const open = data.filter(r => r.status === "open").length;
  $("rh").textContent = `Meldungen (${open} offen)`;
  if (!data.length) { $("reports").innerHTML = `<div class="grp"><div class="row t2">Keine Meldungen.</div></div>`; return; }
  $("reports").innerHTML = `<div class="grp">` + data.map(r => {
    const content = [
      r.rating_title ? `Bewertung von «${esc(r.rating_title)}»` : "",
      r.rating_note ? `<blockquote>${esc(r.rating_note)}</blockquote>` : "",
      r.rating_personal?.scene ? `<blockquote>Beste Szene: ${esc(r.rating_personal.scene)}</blockquote>` : "",
      r.rec_title ? `Empfehlung «${esc(r.rec_title)}»` : "",
      r.rec_message ? `<blockquote>${esc(r.rec_message)}</blockquote>` : "",
      r.wish_body ? `Wunsch<blockquote>${esc(r.wish_body)}</blockquote>` : ""
    ].join("");
    const acts = r.status !== "open" ? "" : `<div class="acts">
      ${r.rating_id ? `<button class="d" data-a="clear_note" data-id="${r.id}">Notiz entfernen</button><button class="d" data-a="delete_rating" data-id="${r.id}">Bewertung löschen</button>` : ""}
      ${r.recommendation_id ? `<button class="d" data-a="delete_rec" data-id="${r.id}">Empfehlung löschen</button>` : ""}
      ${r.wish_id ? `<button class="d" data-a="delete_wish" data-id="${r.id}">Wunsch löschen</button>` : ""}
      ${r.reported_id ? `<button class="d" data-a="remove_avatar" data-id="${r.id}">Profilbild entfernen</button>` : ""}
      <button class="ok" data-a="dismiss" data-id="${r.id}">Kein Verstoss</button></div>`;
    return `<div class="row">
      <div class="top"><b>${esc(r.reason)}</b><span class="pill ${r.status === "open" ? "" : "done"}">${r.status === "open" ? "offen" : r.status === "dismissed" ? "kein Verstoss" : "erledigt"}</span></div>
      <div class="t2">@${esc(r.reported || "gelöscht")} gemeldet von @${esc(r.reporter || "gelöscht")} · ${day(r.created_at)}</div>
      ${r.details ? `<blockquote>${esc(r.details)}</blockquote>` : ""}
      ${content ? `<div style="margin-top:8px">${content}</div>` : ""}
      ${acts}</div>`;
  }).join("") + `</div>`;
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    const labels = { delete_rating: "Bewertung endgültig löschen?", delete_rec: "Empfehlung löschen?", delete_wish: "Wunsch löschen?", clear_note: "Notiz und beste Szene entfernen?", remove_avatar: "Profilbild entfernen?", dismiss: "Als «kein Verstoss» schliessen?" };
    if (!confirm(labels[b.dataset.a])) return;
    b.disabled = true;
    const { error } = await sb.rpc("dev_moderate", { report: b.dataset.id, action: b.dataset.a });
    if (error) { alert(error.message); b.disabled = false; return; }
    loadReports();
  });
}

const num = n => Number(n ?? 0).toLocaleString("de-CH");
const pct = (a, b) => b ? Math.round(a / b * 100) + " %" : "–";
const GENRES = {"Action":"Action","Adventure":"Abenteuer","Animation":"Animation","Biography":"Biografie","Comedy":"Komödie","Crime":"Krimi","Documentary":"Dokumentarfilm","Drama":"Drama","Family":"Familie","Fantasy":"Fantasy","History":"Geschichte","Horror":"Horror","Music":"Musik","Musical":"Musical","Mystery":"Mystery","Romance":"Romantik","Sci-Fi":"Science-Fiction","Science Fiction":"Science-Fiction","Sport":"Sport","Thriller":"Thriller","War":"Krieg","Western":"Western"};

// Waagrechte Balken: [Beschriftung, Wert, Zusatztext]
function hbars(el, rows) {
  const max = Math.max(1, ...rows.map(r => r[1]));
  $(el).innerHTML = rows.length ? rows.map(([l, v, extra]) => `<div class="hrow"><div class="l">${esc(l)}</div><div class="b"><i style="width:${Math.max(2, v / max * 100)}%"></i></div><div class="n">${extra ?? num(v)}</div></div>`).join("") : `<div class="row t2">Noch keine Daten.</div>`;
}
// Senkrechte Balken, optional gestapelt (zweiter Wert lila)
function vbars(el, items, legend) {
  const max = Math.max(1, ...items.map(x => x.a + (x.b || 0)));
  $(el).innerHTML = `<div class="bars">` + items.map(x => {
    const t = x.a + (x.b || 0);
    return `<div class="bar" title="${esc(x.label)}: ${t}"><small>${t || ""}</small>${x.b ? `<i class="s" style="height:${x.b / max * 100}%"></i>` : ""}<i style="height:${x.a / max * 100}%;${x.b ? "border-radius:0" : ""}"></i></div>`;
  }).join("") + `</div><div class="blab">` + items.map(x => `<span>${esc(x.short)}</span>`).join("") + `</div>` + (legend ? `<div class="legend">${legend}</div>` : "");
}

async function loadStats() {
  const { data: s, error } = await sb.rpc("dev_stats");
  if (error) { $("tiles").innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  const t = s.totals, f = s.funnel;
  const tiles = [
    [num(t.users), "Nutzer"],
    [num(s.active.d7), "aktiv in 7 Tagen"],
    [num(s.active.d30), "aktiv in 30 Tagen"],
    [num(t.ratings), `Bewertungen (${num(t.movies)} Filme, ${num(t.series)} Serien)`],
    [t.avg_score ?? "–", "Schnitt aller Noten"],
    [num(t.friendships), `Freundschaften (${num(t.friend_requests_open)} offen)`],
    [t.avg_friends ?? "–", "Freunde pro Nutzer"],
    [num(t.watchlist), "auf Merklisten"],
    [num(t.recommendations), `Empfehlungen (${num(t.recommendations_accepted)} angenommen)`],
    [num(t.shared_lists), `gemeinsame Listen (${num(t.shared_list_items)} Titel)`],
    [num(t.episodes_tracked), "verfolgte Serien"],
    [num(t.wishes), `Wünsche · ${num(t.feedback_threads)} Feedback-Verläufe`]
  ];
  $("tiles").innerHTML = tiles.map(([v, l]) => `<div class="tile"><b>${v}</b><span>${esc(l)}</span></div>`).join("");

  const wd = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  vbars("days", s.days.map(d => { const dt = new Date(d.day + "T12:00:00"); return { a: d.ratings, label: `${dt.toLocaleDateString("de-CH")}, ${d.active} aktiv, ${d.new_users} neu`, short: wd[dt.getDay()] }; }),
    `Neue Nutzer in 14 Tagen: ${num(s.days.reduce((n, d) => n + d.new_users, 0))} · heute aktiv: ${num(s.days[s.days.length - 1]?.active)}`);
  vbars("weeks", s.weeks.map(w => { const dt = new Date(w.week + "T12:00:00"); return { a: w.movies, b: w.series, label: `Woche ab ${dt.toLocaleDateString("de-CH")}: ${w.active} aktiv, ${w.new_users} neu`, short: dt.getDate() + "." + (dt.getMonth() + 1) + "." }; }),
    `<i style="background:#0a84ff"></i>Filme<i style="background:#bf5af2"></i>Serien`);
  hbars("funnel", [["Registriert", f.registered, num(f.registered)], ["Erste Bewertung", f.first_rating, `${num(f.first_rating)} · ${pct(f.first_rating, f.registered)}`], ["Erster Freund", f.first_friend, `${num(f.first_friend)} · ${pct(f.first_friend, f.registered)}`], ["5 Bewertungen", f.five_ratings, `${num(f.five_ratings)} · ${pct(f.five_ratings, f.registered)}`]]);
  vbars("scores", s.scores.map(x => ({ a: x.count, label: `Note ${x.score}`, short: String(x.score) })), "Ganze Punkte: 8 heisst 8.0 bis 8.9");
  hbars("toptitles", s.top_titles.map(x => [x.title, x.count, `${x.count}× · ${x.avg}`]));
  hbars("genres", s.genres.map(x => [GENRES[x.genre] || x.genre, x.count]));
  const w = s.where || {};
  hbars("where", Object.entries(w).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, v, `${num(v)} · ${pct(v, t.ratings)}`]));
  hbars("push", [["Nutzer mit Push", s.push.users, `${num(s.push.users)} · ${pct(s.push.users, t.users)}`], ["Geräte", s.push.devices], ["davon TestFlight", s.push.testflight_devices]]);
  $("gen").textContent = "Stand: " + day(s.generated_at);

  // Nutzertabelle
  const users = s.users || [];
  $("uh").textContent = `Nutzer (${users.length})`;
  $("users").innerHTML = `<tr><th>Nutzer</th><th>E-Mail</th><th>Bewertungen</th><th>Freunde</th><th>Merkliste</th><th>Letzte Bewertung</th><th>Zuletzt angemeldet</th><th>Push</th><th>Seit</th></tr>` +
    users.map(u => `<tr><td>@${esc(u.username)}</td><td>${esc(u.email)}</td><td>${u.ratings}</td><td>${u.friends}</td><td>${u.watchlist}</td><td>${day(u.last_rating)}</td><td>${day(u.last_sign_in_at)}</td><td>${u.push ? "✓" : ""}</td><td>${day(u.created_at)}</td></tr>`).join("");
}

$("go").onclick = async () => {
  $("lerr").textContent = ""; $("go").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  $("go").disabled = false;
  if (error) { $("lerr").textContent = /invalid/i.test(error.message) ? "E-Mail oder Passwort falsch." : error.message; return; }
  show();
};
$("pw").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
$("out").onclick = async () => { await sb.auth.signOut(); show(); };
show();
</script>
</body></html>
