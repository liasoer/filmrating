name: Kinoprogramm aktualisieren
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/kino.py
      - run: |
          git config user.name "kino-bot"
          git config user.email "kino-bot@users.noreply.github.com"
          git add kino.json
          git diff --cached --quiet || (git commit -m "Kinoprogramm aktualisiert" && git push)
